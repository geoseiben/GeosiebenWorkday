
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideInX {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.6); }
    70% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-10px) scale(0.96); }
  }
  @keyframes countBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes checkDraw {
    from { stroke-dashoffset: 24; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .animate-fade-slide { animation: fadeSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .animate-fade-slide-x { animation: fadeSlideInX 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .animate-pop { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .animate-shake { animation: shake 0.35s ease-in-out; }
  .animate-toast-in { animation: toastIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .animate-toast-out { animation: toastOut 0.15s ease-in both; }
  .animate-count-bump { animation: countBump 0.3s ease-out; }
  .animate-modal-in { animation: modalIn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .check-path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: checkDraw 0.25s 0.08s ease-out forwards; }

  .btn-press { transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease; }
  .btn-press:active { transform: scale(0.96); }

  .card-hover { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .card-hover:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.4); }

  .opt-row { transition: all 0.18s ease; }

  .icon-btn { transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1); }
  .icon-btn:hover { transform: scale(1.12); }
  .icon-btn:active { transform: scale(0.88); }

  .tab-btn { transition: all 0.2s ease; }
  input, textarea { transition: all 0.15s ease; }

  .spin { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<head th:replace="includes/header :: header"></head>
<body class="from-slate-50 via-slate-100 to-indigo-50/20 min-h-screen text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

<div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end pointer-events-none"></div>

<div class="max-w-7xl mx-auto px-4 py-8">

  <div class="flex items-center justify-between gap-4 mb-6 animate-fade-slide">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-600/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-tight">Assessment Builder</h1>
        <p class="text-xs text-slate-500">Manage multiple-choice items</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2.5">
      <span id="questionCount" class="inline-flex items-center gap-1.5 bg-white text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-200/80 shadow-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span id="countText">0 Questions</span>
      </span>
    </div>
  </div>

  <div class="flex items-center justify-between gap-2 mb-6 bg-slate-200/60 p-1 rounded-xl shadow-inner animate-fade-slide" style="animation-delay:0.03s">
    <div class="flex gap-1 w-full">
      <button id="tabView" onclick="switchTab('view')" class="tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs">
        View Questions
      </button>
      <button id="tabAdd" onclick="switchTab('add')" class="tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">
        Add New Question
      </button>
    </div>
  </div>

  <div id="viewPanel">
    <div id="emptyState" class="hidden bg-white border border-dashed border-slate-300 rounded-2xl py-12 text-center shadow-xs animate-fade-slide">
      <div class="w-12 h-12 mx-auto bg-slate-50 rounded-full flex items-center justify-center mb-2.5 border border-slate-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.5m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p class="text-slate-700 font-semibold text-sm">No questions added yet</p>
      <p class="text-slate-400 text-xs mt-0.5">Click below to create your first question.</p>
      <button onclick="switchTab('add')" class="btn-press mt-4 inline-flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md shadow-indigo-600/20">
        + Add Question
      </button>
    </div>
    <div id="questionsList" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 items-start"></div>
  </div>

  <div id="addPanel" class="hidden">
    <div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-xl shadow-slate-200/40 animate-fade-slide max-w-xl mx-auto">
      <h2 class="text-lg font-bold text-slate-900 mb-0.5" id="formTitle">Add New Question</h2>
      <p class="text-xs text-slate-500 mb-5">Fill in the prompt and define the options.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Question Prompt</label>
          <textarea id="questionText" rows="2" placeholder="e.g. What is the powerhouse of the cell?"
            class="w-full rounded-xl border border-slate-300 bg-slate-50/50 px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 resize-none shadow-xs"></textarea>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">Answer Options (4)</label>
            <span class="text-[11px] text-indigo-600 font-medium">Select correct radio</span>
          </div>
          <div id="optionsContainer" class="space-y-2"></div>
        </div>

        <p id="formError" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2 shadow-xs"></p>

        <div class="flex gap-2.5 pt-2">
          <button onclick="saveQuestion()" type="button" id="saveBtn"
            class="btn-press bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-5 py-2 rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-indigo-600/20">
            <svg id="saveSpinner" class="hidden spin w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="saveBtnText">Save Question</span>
          </button>
          <button onclick="cancelForm()" type="button"
            class="btn-press bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl shadow-xs">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
  <div id="deleteBackdrop" class="absolute inset-0 bg-slate-900/40 backdrop-blur-2xs transition-opacity duration-150 opacity-0" onclick="closeDeleteModal()"></div>
  <div id="deleteModalBox" class="relative bg-white rounded-2xl shadow-xl max-w-xs w-full p-5 border border-slate-100">
    <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-red-50 border border-red-100 mb-3 shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </div>
    <h3 class="text-sm font-bold text-slate-900">Delete question?</h3>
    <p class="text-xs text-slate-500 mt-0.5">This item will be permanently removed.</p>
    <div class="flex gap-2.5 mt-5">
      <button onclick="confirmDelete()" class="btn-press flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-md shadow-red-600/20">Delete</button>
      <button onclick="closeDeleteModal()" class="btn-press flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl shadow-xs">Cancel</button>
    </div>
  </div>
</div>
<div th:replace="~{fragments/messenger :: chat-widget}"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
  let questions = [];
  let editingId = null;
  let pendingDeleteId = null;
  let nextId = 3;
  const optionLetters = ['A', 'B', 'C', 'D'];

  /* ---------------- Toasts ---------------- */
  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const styles = {
      success: { bg: 'bg-white', border: 'border-emerald-200', icon: 'text-emerald-600', path: 'M5 13l4 4L19 7' },
      error: { bg: 'bg-white', border: 'border-red-200', icon: 'text-red-600', path: 'M6 18L18 6M6 6l12 12' }
    };
    const s = styles[type];
    toast.className = `pointer-events-auto animate-toast-in ${s.bg} border ${s.border} rounded-xl shadow-lg px-3.5 py-2.5 flex items-center gap-2 text-xs font-semibold text-slate-700 min-w-[190px]`;
    toast.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 ${s.icon} shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="${s.path}" />
      </svg>
      <span>${message}</span>
    `;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.remove('animate-toast-in');
      toast.classList.add('animate-toast-out');
      setTimeout(() => toast.remove(), 150);
    }, 1800);
  }

  const params = new URLSearchParams(window.location.search);
  const assesmentid = params.get('assesmentid');

  /* ---------------- Tabs ---------------- */
  function switchTab(tab) {
    const viewPanel = document.getElementById('viewPanel');
    const addPanel = document.getElementById('addPanel');
    const tabView = document.getElementById('tabView');
    const tabAdd = document.getElementById('tabAdd');

    if (tab === 'view') {
      viewPanel.classList.remove('hidden');
      addPanel.classList.add('hidden');
      tabView.className = "tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs";
      tabAdd.className = "tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
      renderQuestions();
    } else {
      viewPanel.classList.add('hidden');
      addPanel.classList.remove('hidden');
      tabAdd.className = "tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs";
      tabView.className = "tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
      if (editingId === null) resetForm();
    }
  }

  function resetForm() {
    document.getElementById('formTitle').textContent = 'Add New Question';
    document.getElementById('saveBtnText').textContent = 'Save Question';
    document.getElementById('questionText').value = '';
    document.getElementById('formError').classList.add('hidden');
    
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      addOptionField('', i === 0);
    }
    editingId = null;
  }

  /* ---------------- Options (Fixed 4) ---------------- */
  function addOptionField(value = '', checked = false) {
    const container = document.getElementById('optionsContainer');
    const index = container.children.length;
    if (index >= 4) return;

    const row = document.createElement('div');
    row.className = "flex items-center gap-2 option-row opt-row rounded-xl p-1 animate-fade-slide-x";
    row.innerHTML = `
      <input type="radio" name="correctOption" class="correct-radio w-3.5 h-3.5 accent-indigo-600 shrink-0 cursor-pointer" ${checked ? 'checked' : ''} onchange="highlightCorrect(this)">
      <span class="opt-index w-5 text-xs font-bold text-slate-400 shrink-0">${optionLetters[index]}</span>
      <input type="text" class="option-input flex-1 rounded-lg border border-slate-300 bg-slate-50/40 px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 shadow-xs" placeholder="Option ${optionLetters[index]}" value="${escapeAttr(value)}">
    `;
    container.appendChild(row);
    if (checked) highlightCorrect(row.querySelector('.correct-radio'));
  }

  function highlightCorrect(radio) {
    document.querySelectorAll('#optionsContainer .option-row').forEach(row => {
      row.classList.remove('bg-emerald-50/70', 'border', 'border-emerald-200');
    });
    const row = radio.closest('.option-row');
    row.classList.add('bg-emerald-50/70', 'border', 'border-emerald-200');
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------------- Save ---------------- */
  function saveQuestion() {
    const textEl = document.getElementById('questionText');
    const text = textEl.value.trim();
    const rows = document.querySelectorAll('#optionsContainer .option-row');
    const options = [];
    let correctIndex = -1;
    let hasEmpty = false;
    let firstEmptyInput = null;

    rows.forEach((row, i) => {
      const input = row.querySelector('.option-input');
      const val = input.value.trim();
      if (!val) { hasEmpty = true; if (!firstEmptyInput) firstEmptyInput = input; }

      options.push(val);
      if (row.querySelector('.correct-radio').checked) correctIndex = i;
    });

    if (!text) {
      showError('Please enter a question prompt.');
      textEl.focus();
      shakeForm();
      return;
    }
    if (options.length !== 4 || hasEmpty) {
      showError('Please fill in all 4 options.');
      if (firstEmptyInput) firstEmptyInput.focus();
      shakeForm();
      return;
    }
    if (correctIndex === -1) {
      showError('Please select the correct answer option.');
      shakeForm();
      return;
    }
    document.getElementById('formError').classList.add('hidden');

    const saveBtn = document.getElementById('saveBtn');
    const saveSpinner = document.getElementById('saveSpinner');
    const saveBtnText = document.getElementById('saveBtnText');
    saveBtn.disabled = true;
    saveSpinner.classList.remove('hidden');
    saveBtnText.textContent = editingId !== null ? 'Updating...' : 'Saving...';

    setTimeout(() => {
      const isEdit = editingId !== null;
      if (isEdit) {
        const q = questions.find(q => q.id === editingId);
        q.text = text;
        q.options = options;
        q.correctIndex = correctIndex;
      } else {
        saveQuestionServer({assesmentid,a:options[0],b:options[1],c:options[2],d:options[3],correct:options[correctIndex],question:text});
        questions.push({ id: nextId++, text, options, correctIndex });
      }

      saveBtn.disabled = false;
      saveSpinner.classList.add('hidden');
      saveBtnText.textContent = isEdit ? 'Update Question' : 'Save Question';

      switchTab('view');
      showToast(isEdit ? 'Question updated' : 'Question added', 'success');
    }, 250);
  }

  function shakeForm() {
    const formCard = document.querySelector('#addPanel > div');
    formCard.classList.remove('animate-shake');
    void formCard.offsetWidth;
    formCard.classList.add('animate-shake');
  }

  function showError(msg) {
    const errorEl = document.getElementById('formError');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
    errorEl.classList.remove('animate-fade-slide');
    void errorEl.offsetWidth;
    errorEl.classList.add('animate-fade-slide');
  }

  function cancelForm() {
    switchTab('view');
  }

  /* ---------------- Edit ---------------- */
  function editQuestion(id) {
    const q = questions.find(q => q.id === id);
    if (!q) return;
    editingId = id;
    switchTab('add');
    document.getElementById('formTitle').textContent = 'Edit Question';
    document.getElementById('saveBtnText').textContent = 'Update Question';
    document.getElementById('questionText').value = q.text;
    document.getElementById('optionsContainer').innerHTML = '';
    q.options.forEach((opt, i) => addOptionField(opt, i === q.correctIndex));
  }

  /* ---------------- Delete (with modal) ---------------- */
  function deleteQuestion(id) {
    pendingDeleteId = id;
    const modal = document.getElementById('deleteModal');
    const backdrop = document.getElementById('deleteBackdrop');
    const box = document.getElementById('deleteModalBox');
    modal.classList.remove('hidden');
    box.classList.remove('animate-modal-in');
    void box.offsetWidth;
    box.classList.add('animate-modal-in');
    requestAnimationFrame(() => backdrop.classList.remove('opacity-0'));
  }

  function closeDeleteModal() {
    const modal = document.getElementById('deleteModal');
    const backdrop = document.getElementById('deleteBackdrop');
    backdrop.classList.add('opacity-0');
    setTimeout(() => modal.classList.add('hidden'), 120);
    pendingDeleteId = null;
  }

  function confirmDelete() {
    const id = pendingDeleteId;
    closeDeleteModal();
    const card = document.querySelector(`[data-qid="${id}"]`);
    if (card) {
      card.style.transition = 'all 0.18s ease';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.96)';
      setTimeout(() => {
        questions = questions.filter(q => q.id !== id);
        renderQuestions();
        showToast('Question deleted', 'error');
      }, 150);
    } else {
      questions = questions.filter(q => q.id !== id);
      renderQuestions();
    }
  }

  function saveQuestionServer(data){
          const token = $("meta[name='_csrf']").attr('content');

    $.ajax({
      url: '/course/saveQuestion',
      type: 'POST',
      headers:{'X-CSRF-TOKEN':token},
      data: data,
      dataType: 'JSON',
      success: (res) => { },
      error: (err) => {  }
    })
  }
   
  function fetchAssesmentData(){
    $.ajax({
      url: '/course/getQuestions',
      type: 'GET',
      data: { assesmentid: assesmentid },
      dataType: 'JSON',
      success: (res) => {
        console.log(res);
        questions = res;
        renderQuestions();
      },
      error: (err) => {  }
    })
  }
  fetchAssesmentData();

  /* ---------------- Render Grid View ---------------- */
  function renderQuestions() {
    const list = document.getElementById('questionsList');
    const empty = document.getElementById('emptyState');
    const countEl = document.getElementById('countText');
    const badge = document.getElementById('questionCount');
    countEl.textContent = `${questions.length} Question${questions.length !== 1 ? 's' : ''}`;
    badge.classList.remove('animate-count-bump');
    void badge.offsetWidth;
    badge.classList.add('animate-count-bump');

    if (questions.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    list.innerHTML = questions.map((q, qi) => `
      <div data-qid="${q.id}" class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs card-hover animate-fade-slide flex flex-col justify-between h-full" style="animation-delay:${Math.min(qi * 0.04, 0.25)}s">
        <div>
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-2.5 flex-1">
              <span class="shrink-0 w-6 h-6 flex items-center justify-center rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-bold">${qi + 1}</span>
              <p class="font-medium text-slate-900 text-xs leading-relaxed pt-0.5">${escapeHtml(q.text)}</p>
            </div>
            <div class="flex gap-0.5 shrink-0">
              <button onclick="editQuestion(${q.id})" class="icon-btn p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>
              <button onclick="deleteQuestion(${q.id})" class="icon-btn p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
          <div class="mt-3 space-y-1.5">  
            ${q.options.map((opt, i) => `
              <div class="flex items-center gap-2 text-xs px-3 py-1.5 rounded-xl transition-all duration-150 ${i === q.correctIndex ? 'bg-emerald-50 text-emerald-900 border border-emerald-200/80 font-medium' : 'bg-slate-50/70 text-slate-600 border border-slate-100'}">
                <span class="font-bold w-4 opacity-70 text-[11px]">${optionLetters[i]}</span>
                <span class="flex-1">${escapeHtml(opt)}</span>
                ${i === q.correctIndex ? `
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-600 shrink-0 animate-pop" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path class="check-path" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `).join('');
  }

  resetForm();
</script>
</body>
</html>
