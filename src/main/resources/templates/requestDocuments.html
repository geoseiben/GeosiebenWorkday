<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
  renderMyRequests();

  $('#reqDoc').submit(function(e){
    e.preventDefault();
    const btn = $('#btnSubmit');
    const originalText = btn.html();
    
    btn.prop('disabled', true).addClass('opacity-70 cursor-not-allowed').html('<span class="spinner"></span> Processing...');
    
    const dtype = $('#documentType').val();
    const remarks = $('#remarks').val();
    const csrf = $('#csrf').val();
    const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");

    $.ajax({
      url:'/requestDoc',
      type:'POST',
      headers:{'X-CSRF-TOKEN':csrfToken},
      data:{documentType:dtype,remarks:remarks},
      dataType:'json',
      success:function(data){
          Swal.fire({
            icon: `${data.status}`,
            title: data.status === 'success' ? 'Request Submitted' : 'Note',
            text: data.message || 'Action completed successfully.',
            confirmButtonColor: '#0f172a',
            customClass: {
                popup: 'rounded-2xl',
                confirmButton: 'rounded-xl px-8 py-3'
            }
          }).then(()=>{
            if(data.status === 'success') {
              document.getElementById('reqDoc').reset();
              renderMyRequests();
            }
            btn.prop('disabled', false).removeClass('opacity-70 cursor-not-allowed').html(originalText);
          });
      },
      error:function(err){
        console.log(err);
        Swal.fire({ 
            icon:'error', 
            title:'Connection Error', 
            text:'Unable to reach the server. Please try again.', 
            confirmButtonColor:'#0f172a' 
        });
        btn.prop('disabled', false).removeClass('opacity-70 cursor-not-allowed').html(originalText);
      }
    });
  });

  function renderMyRequests(){
    const csrf = "<?php echo htmlspecialchars($_SESSION['csrf']); ?>";
    const renderBox = $('#render');
    renderBox.html('<tr><td colspan="5" class="py-20 text-center"><span class="spinner !border-slate-300 !border-top-slate-600"></span><p class="text-slate-400 text-xs mt-3 font-medium">Fetching history...</p></td></tr>');

    $.ajax({
      url:'/getDocRequests',
      type:'GET',
      dataType:'json',
      success:function(data){
        let output="";
        let count=1;
        if(data && data.length>0){
          data.forEach((element, index) => {
            let downloadBtn = element.documentpath 
              ? `<a href="api/download.php?file=${encodeURIComponent(element.documentpath)}" class="inline-flex items-center px-3 py-1.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-all text-[11px] font-bold shadow-sm">
                  <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2.5"></path></svg>
                  Download</a>` 
              : '<span class="text-slate-300 text-xs">—</span>';
            
            let statusStyles = "";
            if(element.status === "Delivered") statusStyles = "bg-emerald-50 text-emerald-600 ring-1 ring-emerald-500/20";
            else if(element.status === "Pending") statusStyles = "bg-amber-50 text-amber-600 ring-1 ring-amber-500/20";
            else if(element.status === "Rejected") statusStyles = "bg-rose-50 text-rose-600 ring-1 ring-rose-500/20";
            else statusStyles = "bg-slate-50 text-slate-600 ring-1 ring-slate-500/20";

            output+=`<tr class="hover:bg-slate-50/80 transition-colors animate-row" style="animation-delay: ${index * 0.05}s">
              <td class="py-5 px-6 border-b border-slate-100 font-bold text-slate-300 text-xs">${String(count++).padStart(2, '0')}</td>
              <td class="py-5 px-6 border-b border-slate-100">
                <div class="font-bold text-slate-800 text-sm leading-tight">${element.requestedDocument}</div>
                <div class="text-[10px] text-slate-400 mt-1 truncate max-w-[200px]" title="${element.reason}">${element.reason}</div>
              </td>
              <td class="py-5 px-6 border-b border-slate-100 text-slate-500 text-xs font-medium whitespace-nowrap">
                ${element.requestedOn}
              </td>
              <td class="py-5 px-6 border-b border-slate-100 text-center">
                <span class="inline-flex px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${statusStyles}">
                    ${element.status}
                </span>
              </td>
              <td class="py-5 px-6 border-b border-slate-100 text-right">${downloadBtn}</td>
            </tr>`;
          });
        } else {
          output=`<tr><td colspan="5" class="py-24 text-center">
            <div class="flex flex-col items-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                </div>
                <p class="text-slate-400 font-medium">No request history found.</p>
            </div>
          </td></tr>`;
        }
        renderBox.html(output);
      },
      error:function(err){
        console.log(err);
        renderBox.html(`<tr><td colspan="5" class="py-20 text-center">
            <p class="text-rose-500 font-bold text-sm">Oops! Something went wrong while loading history.</p>
            <button onclick="renderMyRequests()" class="mt-3 text-xs text-indigo-600 font-bold underline">Try again</button>
        </td></tr>`);
      }
    });
  }
});
</script>
