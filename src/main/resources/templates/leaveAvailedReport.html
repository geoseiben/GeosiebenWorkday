<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Availed Report</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f6fb; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        .fade-in { animation: fadeIn .18s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
        .modal-pop { animation: pop .18s ease-out; }
        @keyframes pop { from { opacity: 0; transform: scale(.96);} to { opacity: 1; transform: scale(1);} }
        select.year-select { -webkit-appearance:none; appearance:none; }
    </style>
</head>
<head th:replace="includes/header :: header"></head>

<body class="text-slate-700">

<div class="p-4 md:p-6 max-w-full mx-auto">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Leave Availed Report</h1>
            <p class="text-sm text-slate-500 mt-1">Track and analyze leave utilization across the organization</p>
        </div>

        <div class="flex items-center gap-3">
            <div class="relative">
                <input id="searchInput" type="text" placeholder="Search employee / EID..."
                    class="w-56 rounded-xl border border-slate-200 bg-white pl-9 pr-3 py-2.5 text-sm shadow-sm
                           focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 1 1 4 10.5a6.5 6.5 0 0 1 13 0Z"/>
                </svg>
            </div>

            <div class="relative">
                <select id="yearFilter" class="year-select rounded-xl border border-slate-200 bg-white pl-4 pr-9 py-2.5 text-sm font-semibold
                       text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="all">All Years</option>
                </select>
                <svg class="w-4 h-4 absolute right-3 top-3 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                </svg>
            </div>

            <button id="exportBtn" class="flex items-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 shadow-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                </svg>
                Export Excel
            </button>
        </div>
    </div>

    <!-- Stat Cards -->
    <div id="statCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6"></div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-3">Leave Type Distribution</h3>
            <div class="relative h-64"><canvas id="leaveTypeChart"></canvas></div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-3">Monthly Trend</h3>
            <div class="relative h-64"><canvas id="monthlyTrendChart"></canvas></div>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
                        <th class="text-left font-bold px-5 py-3">Sl No</th>
                        <th class="text-left font-bold px-5 py-3">Employee</th>
                        <th class="text-left font-bold px-5 py-3">EID</th>
                        <th class="text-center font-bold px-5 py-3">Year</th>
                        <th class="text-center font-bold px-5 py-3">CL</th>
                        <th class="text-center font-bold px-5 py-3">SL</th>
                        <th class="text-center font-bold px-5 py-3">RH</th>
                        <th class="text-center font-bold px-5 py-3">EL</th>
                        <th class="text-center font-bold px-5 py-3">CO</th>
                        <th class="text-center font-bold px-5 py-3 cursor-pointer select-none" id="sortTotalBtn">
                            Total <span id="sortIcon">↕</span>
                        </th>
                        <th class="text-center font-bold px-5 py-3">Details</th>
                    </tr>
                </thead>
                <tbody id="dataRoot" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>

        <div class="flex items-center justify-between px-5 py-3 border-t border-slate-100 text-sm text-slate-500">
            <span id="pageInfo"></span>
            <div id="pagination" class="flex items-center gap-1"></div>
        </div>
    </div>
</div>

<!-- Custom Modal -->
<div id="modalOverlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div id="modalBox" class="modal-pop bg-white rounded-2xl shadow-xl w-full max-w-xl max-h-[85vh] overflow-hidden flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
            <h3 id="modalTitle" class="font-bold text-slate-800"></h3>
            <button id="modalClose" class="text-slate-400 hover:text-slate-600 rounded-lg p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div id="modalBody" class="p-5 overflow-y-auto"></div>
    </div>
</div>
<div th:replace="~{fragments/messenger :: chat-widget}"></div>
<script>
const LEAVE_KEYS = [
    { key: 'clAvailed', label: 'CL', color: '#0ea5e9', bg: 'bg-sky-50', text: 'text-sky-700', ring:'ring-sky-100' },
    { key: 'sLAvailed', label: 'SL', color: '#ef4444', bg: 'bg-red-50', text: 'text-red-700', ring:'ring-red-100' },
    { key: 'rhAvailed', label: 'RH', color: '#eab308', bg: 'bg-amber-50', text: 'text-amber-700', ring:'ring-amber-100' },
    { key: 'elAvailed', label: 'EL', color: '#22c55e', bg: 'bg-emerald-50', text: 'text-emerald-700', ring:'ring-emerald-100' },
    { key: 'coAvailed', label: 'CO', color: '#8b5cf6', bg: 'bg-violet-50', text: 'text-violet-700', ring:'ring-violet-100' }
];

let rawData = [];
let typeChart = null, trendChart = null;
let state = { year: 'all', search: '', page: 1, pageSize: 100};

const toNum = v => parseFloat(v) || 0;
const rowTotal = r => LEAVE_KEYS.reduce((s, lk) => s + toNum(r[lk.key === 'sLAvailed' ? 'sLAvailed' : lk.key]), 0);

document.addEventListener('DOMContentLoaded', () => {
    fetch('/admin/getLeaveAvailedReport', {
        method: 'GET',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },    })
    .then(res => res.json())
    .then(res => {
        console.log(res);
        rawData = res.data ? res.data : res;
        populateYearFilter(rawData);
        renderAll();
    })
    .catch((err) => {
        console.log(err);
        document.getElementById('dataRoot').innerHTML =
            `<tr><td colspan="11" class="text-center py-10 text-red-500">Failed to load data.</td></tr>`;
    });

    document.getElementById('yearFilter').addEventListener('change', e => {
        state.year = e.target.value; state.page = 1; renderAll();
    });
    document.getElementById('searchInput').addEventListener('input', e => {
        state.search = e.target.value.toLowerCase(); state.page = 1; renderTable();
    });
    document.getElementById('sortTotalBtn').addEventListener('click', () => {
        state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
        document.getElementById('sortIcon').textContent = state.sortDir === 'desc' ? '↓' : '↑';
        renderTable();
    });
    document.getElementById('exportBtn').addEventListener('click', exportExcel);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e => {
        if (e.target.id === 'modalOverlay') closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
});

function populateYearFilter(rows) {
    const years = [...new Set(rows.map(r => String(r.year)))].sort((a, b) => b - a);
    const sel = document.getElementById('yearFilter');
    years.forEach(y => sel.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`));
    if (years.length) { sel.value = years[0]; state.year = years[0]; }
}

function getYearFilteredRows() {
    return state.year === 'all' ? rawData : rawData.filter(r => String(r.year) === String(state.year));
}

function getFullyFilteredRows() {
    let rows = getYearFilteredRows();
    if (state.search) {
        rows = rows.filter(r =>
            (r.employeeName || '').toLowerCase().includes(state.search) ||
            String(r.EID).toLowerCase().includes(state.search)
        );
    }
    return rows;
}

function renderAll() {
    const yearRows = getYearFilteredRows();
    renderStats(yearRows);
    renderTypeChart(yearRows);
    renderTrendChart(yearRows, state.year);
    renderTable();
}

function renderStats(rows) {
    const totals = LEAVE_KEYS.map(lk => rows.reduce((s, r) => s + toNum(r[lk.key]), 0));
    const grand = totals.reduce((a, b) => a + b, 0);

    let html = LEAVE_KEYS.map((lk, i) => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 ring-1 ${lk.ring}">
            <div class="text-xs font-semibold ${lk.text} ${lk.bg} inline-block px-2 py-0.5 rounded-md mb-2">${lk.label}</div>
            <div class="text-2xl font-extrabold text-slate-800">${totals[i].toFixed(1)}</div>
            <div class="text-xs text-slate-400 mt-0.5">days availed</div>
        </div>
    `).join('');

    html += `
        <div class="bg-slate-800 rounded-xl shadow-sm p-4">
            <div class="text-xs font-semibold text-slate-300 inline-block px-2 py-0.5 rounded-md mb-2">TOTAL</div>
            <div class="text-2xl font-extrabold text-white">${grand.toFixed(1)}</div>
            <div class="text-xs text-slate-400 mt-0.5">across ${rows.length} record(s)</div>
        </div>`;

    document.getElementById('statCards').innerHTML = html;
}

function renderTable() {
    const filtered = getFullyFilteredRows();
    const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    state.page = Math.min(state.page, totalPages);
    const start = (state.page - 1) * state.pageSize;
    const pageRows = filtered.slice(start, start + state.pageSize);

    let html = '';
    if (pageRows.length === 0) {
        html = `<tr><td colspan="11" class="text-center py-10 text-slate-400">No records found.</td></tr>`;
    } else {
        pageRows.forEach((r, i) => {
            const cl = toNum(r.clAvailed), sl = toNum(r.sLAvailed), rh = toNum(r.rhAvailed),
                  el = toNum(r.elAvailed), co = toNum(r.coAvailed);
            const total = cl + sl + rh + el + co;
            html += `
                <tr class="hover:bg-slate-50 transition-colors fade-in">
                    <td class="px-5 py-3 text-slate-400">${start + i + 1}</td>
                    <td class="px-5 py-3 font-semibold text-slate-700">${r.employeeName}</td>
                    <td class="px-5 py-3 text-slate-500">${r.EID}</td>
                    <td class="px-5 py-3 text-center text-slate-500">${r.year}</td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-sky-50 text-sky-700">${cl.toFixed(2)}</span></td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-red-50 text-red-700">${sl.toFixed(2)}</span></td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-amber-50 text-amber-700">${rh.toFixed(2)}</span></td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-emerald-50 text-emerald-700">${el.toFixed(2)}</span></td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-md text-xs font-bold bg-violet-50 text-violet-700">${co.toFixed(2)}</span></td>
                    <td class="px-5 py-3 text-center font-bold text-slate-800">${total.toFixed(2)}</td>
                    <td class="px-5 py-3 text-center">
                        <button class="view-btn text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-full px-3 py-1.5"
                            data-eid="${r.EID}" data-year="${r.year}">View</button>
                    </td>
                </tr>`;
        });
    }
    document.getElementById('dataRoot').innerHTML = html;

    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const rec = rawData.find(r => String(r.EID) === btn.dataset.eid && String(r.year) === btn.dataset.year);
            showMonthlyBreakup(rec);
        });
    });

    document.getElementById('pageInfo').textContent =
        filtered.length === 0 ? 'No records' :
        `Showing ${start + 1}-${Math.min(start + state.pageSize, filtered.length)} of ${filtered.length}`;

    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    let html = '';
    const mk = (label, page, disabled, active) => `
        <button ${disabled ? 'disabled' : ''} data-page="${page}"
            class="page-btn px-3 py-1.5 rounded-lg text-xs font-semibold border
            ${active ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}
            ${disabled ? 'opacity-40 cursor-not-allowed' : ''}">${label}</button>`;

    html += mk('Prev', state.page - 1, state.page === 1, false);
    for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 7 && p !== 1 && p !== totalPages && Math.abs(p - state.page) > 1) {
            if (p === 2 || p === totalPages - 1) html += `<span class="px-1 text-slate-300">…</span>`;
            continue;
        }
        html += mk(p, p, false, p === state.page);
    }
    html += mk('Next', state.page + 1, state.page === totalPages, false);

    document.getElementById('pagination').innerHTML = html;
    document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            state.page = parseInt(btn.dataset.page, 10);
            renderTable();
        });
    });
}

function renderTypeChart(rows) {
    const totals = LEAVE_KEYS.map(lk => rows.reduce((s, r) => s + toNum(r[lk.key]), 0));
    const ctx = document.getElementById('leaveTypeChart').getContext('2d');
    if (typeChart) typeChart.destroy();
    typeChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: LEAVE_KEYS.map(lk => lk.label),
            datasets: [{ data: totals, backgroundColor: LEAVE_KEYS.map(lk => lk.color), borderRadius: 8, maxBarThickness: 46 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } }
        }
    });
}

function renderTrendChart(rows, year) {
    const monthMap = {};
    rows.forEach(r => (r.monthData || []).forEach(m => {
        monthMap[m.month] = monthMap[m.month] || { clAvailed: 0, SLAvailed: 0, rhAvailed: 0, elAvailed: 0, coAvailed: 0 };
        monthMap[m.month].clAvailed += toNum(m.clAvailed);
        monthMap[m.month].SLAvailed += toNum(m.SLAvailed);
        monthMap[m.month].rhAvailed += toNum(m.rhAvailed);
        monthMap[m.month].elAvailed += toNum(m.elAvailed);
        monthMap[m.month].coAvailed += toNum(m.coAvailed);
    }));

    let labels;
    if (year !== 'all') {
        const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        labels = mn.map(m => `${m}-${year}`);
    } else {
        labels = Object.keys(monthMap).sort((a, b) => new Date('01-' + a) - new Date('01-' + b));
    }

    const seriesDefs = [
        { key: 'clAvailed', label: 'CL', color: '#0ea5e9' },
        { key: 'SLAvailed', label: 'SL', color: '#ef4444' },
        { key: 'rhAvailed', label: 'RH', color: '#eab308' },
        { key: 'elAvailed', label: 'EL', color: '#22c55e' },
        { key: 'coAvailed', label: 'CO', color: '#8b5cf6' }
    ];
    const datasets = seriesDefs.map(sd => ({
        label: sd.label,
        data: labels.map(l => (monthMap[l] ? monthMap[l][sd.key] : 0) || 0),
        borderColor: sd.color, backgroundColor: sd.color, tension: 0.35, fill: false, pointRadius: 2
    }));

    const ctx = document.getElementById('monthlyTrendChart').getContext('2d');
    if (trendChart) trendChart.destroy();
    trendChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
            scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } }
        }
    });
}

function openModal(title) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
    document.getElementById('modalBody').innerHTML = '';
}

function showMonthlyBreakup(record) {
    if (!record) return;
    const months = record.monthData || [];

    let rowsHtml = months.map(m => `
        <tr class="border-b border-slate-100">
            <td class="py-2 pr-2 text-slate-600">${m.month}</td>
            <td class="py-2 px-2 text-center">${toNum(m.clAvailed).toFixed(2)}</td>
            <td class="py-2 px-2 text-center">${toNum(m.SLAvailed).toFixed(2)}</td>
            <td class="py-2 px-2 text-center">${toNum(m.rhAvailed).toFixed(2)}</td>
            <td class="py-2 px-2 text-center">${toNum(m.elAvailed).toFixed(2)}</td>
            <td class="py-2 px-2 text-center">${toNum(m.coAvailed).toFixed(2)}</td>
        </tr>`).join('');

    if (!months.length) rowsHtml = `<tr><td colspan="6" class="text-center py-6 text-slate-400">No monthly data.</td></tr>`;

    document.getElementById('modalBody').innerHTML = `
        <div class="relative h-56 mb-4"><canvas id="modalChart"></canvas></div>
        <div class="max-h-56 overflow-y-auto">
            <table class="w-full text-sm">
                <thead class="text-xs uppercase text-slate-400">
                    <tr><th class="text-left pb-2">Month</th><th class="pb-2">CL</th><th class="pb-2">SL</th><th class="pb-2">RH</th><th class="pb-2">EL</th><th class="pb-2">CO</th></tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>`;

    openModal(`${record.employeeName} — ${record.year}`);

    const ctx = document.getElementById('modalChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: months.map(m => m.month),
            datasets: [
                { label: 'CL', data: months.map(m => toNum(m.clAvailed)), backgroundColor: '#0ea5e9' },
                { label: 'SL', data: months.map(m => toNum(m.SLAvailed)), backgroundColor: '#ef4444' },
                { label: 'RH', data: months.map(m => toNum(m.rhAvailed)), backgroundColor: '#eab308' },
                { label: 'EL', data: months.map(m => toNum(m.elAvailed)), backgroundColor: '#22c55e' },
                { label: 'CO', data: months.map(m => toNum(m.coAvailed)), backgroundColor: '#8b5cf6' }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
            scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' } } }
        }
    });
}

function exportExcel() {
    const rows = getFullyFilteredRows();
    const data = rows.map((r, i) => ({
        'Sl No': i + 1,
        'Employee Name': r.employeeName,
        'EID': r.EID,
        'Year': r.year,
        'CL': toNum(r.clAvailed).toFixed(2),
        'SL': toNum(r.sLAvailed).toFixed(2),
        'RH': toNum(r.rhAvailed).toFixed(2),
        'EL': toNum(r.elAvailed).toFixed(2),
        'CO': toNum(r.coAvailed).toFixed(2),
        'Total': rowTotal(r).toFixed(2)
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Leave Availed');
    XLSX.writeFile(wb, `Leave_Availed_Report_${state.year}.xlsx`);
}
</script>
</body>
</html>
