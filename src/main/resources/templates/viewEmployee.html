<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Profile — View & Edit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1034A6',
              dark: '#0B2578',
              light: '#EEF3FF',
              border: '#C7D7FE'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'card': '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.02)',
            'hero': '0 4px 20px -4px rgba(16, 52, 166, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.04)',
            'float': '0 20px 40px -10px rgba(15, 23, 42, 0.18)',
          }
        }
      }
    };
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      color-scheme: light;
    }

    body {
      background-color: #f8fafc;
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 52, 166, 0.03) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.03) 0px, transparent 50%);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .field-input {
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .field-input:focus {
      outline: none;
      border-color: #1034A6;
      box-shadow: 0 0 0 3px rgba(16, 52, 166, 0.12);
      background-color: #ffffff;
    }

    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in-up {
      animation: fadeSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseHighlight {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(16, 52, 166, 0.08); }
    }
    .field-flash {
      animation: pulseHighlight 1s ease-in-out 2;
    }

    @media print {
      body {
        background: #ffffff !important;
        font-size: 10pt;
      }
      .no-print {
        display: none !important;
      }
      .print-full {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .section-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        margin-bottom: 12px !important;
      }
    }
  </style>
</head>
<head th:replace="includes/header :: header"></head>

<body class="text-slate-800 antialiased selection:bg-brand-light selection:text-brand">

  <!-- Main Workspace -->
  <main class="print-full mx-auto max-w-[98%] px-4 py-5 sm:px-6 lg:px-8 pb-24">

    <!-- EXECUTIVE HERO PROFILE HEADER -->
    <section class="mb-6 overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-hero relative">
      <!-- Top Brand Accent Line -->
      <div class="h-1 w-full bg-gradient-to-r from-brand via-blue-600 to-sky-400"></div>

      <!-- Main Identity Row -->
      <div class="px-5 py-4 sm:px-6 sm:py-5">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
          <!-- Left: Avatar + Identity + Quick Copy Pills -->
          <div class="flex flex-col sm:flex-row sm:items-center gap-4">
            <div class="group relative h-18 w-18 sm:h-20 sm:w-20 shrink-0">
              <div class="h-full w-full overflow-hidden rounded-2xl border border-slate-200 bg-brand-light shadow-2xs ring-2 ring-slate-100">
                <img id="heroAvatarImg" src="" alt="Employee Avatar" class="h-full w-full object-cover" />
              </div>
              <label for="avatarFileInput" class="no-print absolute -bottom-1 -right-1 flex h-6.5 w-6.5 cursor-pointer items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm hover:bg-brand hover:text-white hover:border-brand transition p-1" title="Change Profile Photo">
                <i data-lucide="camera" class="h-3.5 w-3.5"></i>
                <input id="avatarFileInput" type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
              </label>
            </div>

            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2.5">
                <h1 id="heroFullName" class="font-display text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900"></h1>
                <span id="heroStatusBadge"></span>
              </div>

              <p id="heroRoleLine" class="mt-0.5 text-xs sm:text-sm font-medium text-slate-500"></p>

              <!-- Copyable Contact & ID Chips -->
              <div class="mt-2.5 flex flex-wrap items-center gap-1.5 text-xs">
                <button type="button" onclick="copyText(employeeData.EID, 'Employee ID')" class="group inline-flex items-center gap-1.5 rounded-md border border-brand-border bg-brand-light/70 px-2.5 py-1 font-mono font-semibold text-brand hover:bg-brand-light transition" title="Copy EID">
                  <i data-lucide="hash" class="h-3 w-3 text-brand/70"></i>
                  <span id="heroEid"></span>
                  <i data-lucide="copy" class="h-3 w-3 opacity-50 group-hover:opacity-100"></i>
                </button>

                <button type="button" onclick="copyText(employeeData.workmail, 'Work Email')" class="group inline-flex items-center gap-1.5 rounded-md border border-slate-200 bg-slate-50/80 px-2.5 py-1 text-slate-700 hover:border-brand-border hover:bg-brand-light/40 hover:text-brand transition" title="Copy Work Email">
                  <i data-lucide="mail" class="h-3 w-3 text-slate-400 group-hover:text-brand"></i>
                  <span id="heroWorkmail"></span>
                  <i data-lucide="copy" class="h-3 w-3 opacity-40 group-hover:opacity-100"></i>
                </button>

                <button type="button" onclick="copyText(employeeData.phone, 'Phone Number')" class="group inline-flex items-center gap-1.5 rounded-md border border-slate-200 bg-slate-50/80 px-2.5 py-1 text-slate-700 hover:border-brand-border hover:bg-brand-light/40 hover:text-brand transition" title="Copy Phone">
                  <i data-lucide="phone" class="h-3 w-3 text-slate-400 group-hover:text-brand"></i>
                  <span id="heroPhone"></span>
                  <i data-lucide="copy" class="h-3 w-3 opacity-40 group-hover:opacity-100"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Right: Toolbar & Primary Edit / Save Controls -->
          <div class="no-print flex flex-wrap items-center gap-2 shrink-0">
            <div class="inline-flex items-center rounded-xl border border-slate-200 bg-slate-50/70 p-1 gap-0.5">
              <button
                type="button"
                onclick="openAuditDrawer()"
                class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-white hover:text-brand hover:shadow-2xs transition"
                title="View Change History & Audit Log"
              >
                <i data-lucide="history" class="h-3.5 w-3.5 text-brand"></i>
                <span>Audit</span>
                <span id="auditCountBadge" class="rounded-full bg-brand-light px-1.5 py-0.2 text-[10px] font-bold text-brand border border-brand-border">0</span>
              </button>

              <button
                type="button"
                onclick="exportProfileJSON()"
                class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-white hover:text-slate-900 hover:shadow-2xs transition"
                title="Download structured JSON payload"
              >
                <i data-lucide="download" class="h-3.5 w-3.5 text-slate-500"></i>
                <span class="hidden sm:inline">JSON</span>
              </button>

              <button
                type="button"
                onclick="window.print()"
                class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-white hover:text-slate-900 hover:shadow-2xs transition"
                title="Print or Save as PDF"
              >
                <i data-lucide="printer" class="h-3.5 w-3.5 text-slate-500"></i>
                <span class="hidden sm:inline">Print</span>
              </button>

              <button
                type="button"
                onclick="getData(true)"
                class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-white hover:text-brand hover:shadow-2xs transition"
                title="Reload latest record from server"
              >
                <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i>
              </button>
            </div>

            <div id="heroActionButtons" class="flex items-center gap-2"></div>
          </div>
        </div>
      </div>

      <!-- Integrated 4-Column Metadata Strip -->
      <div class="grid grid-cols-2 lg:grid-cols-4 border-t border-slate-200/80 bg-slate-50/60 divide-y lg:divide-y-0 lg:divide-x divide-slate-200/80">
        <div class="px-5 py-2.5 sm:px-6 flex items-center gap-3">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-brand-light text-brand border border-brand-border/70">
            <i data-lucide="calendar-clock" class="h-4 w-4"></i>
          </span>
          <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Service Tenure</p>
            <p id="kpiTenure" class="truncate font-display text-xs sm:text-sm font-bold text-slate-900"></p>
            <p id="kpiJoinedSub" class="truncate text-[11px] text-slate-500"></p>
          </div>
        </div>

        <div class="px-5 py-2.5 sm:px-6 flex items-center gap-3">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-sky-50 text-sky-600 border border-sky-200/80">
            <i data-lucide="user-check" class="h-4 w-4"></i>
          </span>
          <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Reporting Manager</p>
            <p id="kpiManager" class="truncate font-display text-xs sm:text-sm font-bold text-slate-900"></p>
            <p id="kpiDeptSub" class="truncate text-[11px] text-slate-500"></p>
          </div>
        </div>

        <div class="px-5 py-2.5 sm:px-6 flex items-center gap-3">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-rose-50 text-rose-600 border border-rose-200/80">
            <i data-lucide="heart-pulse" class="h-4 w-4"></i>
          </span>
          <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Age & Blood Group</p>
            <p id="kpiAgeBlood" class="truncate font-display text-xs sm:text-sm font-bold text-slate-900"></p>
            <p id="kpiDobSub" class="truncate text-[11px] text-slate-500"></p>
          </div>
        </div>

        <div class="px-5 py-2.5 sm:px-6 flex items-center gap-3">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600 border border-emerald-200/80">
            <i data-lucide="shield-check" class="h-4 w-4"></i>
          </span>
          <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Confirmation & Surety</p>
            <p id="kpiConfirm" class="truncate font-display text-xs sm:text-sm font-bold text-slate-900"></p>
            <p id="kpiSuretySub" class="truncate text-[11px] text-slate-500"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- TWO-COLUMN WORKSPACE: Sticky Section Rail + 7 Section Cards -->
    <div class="flex flex-col lg:flex-row gap-6 items-start">

      <!-- Left Sticky Navigation & Quick-Find Rail -->
      <aside class="no-print w-full lg:w-64 shrink-0 lg:sticky lg:top-5 space-y-4">
        <div class="overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-card">
          <!-- Instant Field Quick-Jump Search -->
          <div class="border-b border-slate-100 p-2.5 bg-slate-50/60">
            <div class="relative">
              <i data-lucide="search" class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-slate-400"></i>
              <input
                id="fieldSearchInput"
                type="text"
                placeholder="Jump to field (e.g. IFSC, UAN)..."
                oninput="handleFieldSearch(this.value)"
                class="w-full rounded-lg border border-slate-200 bg-white py-1.5 pl-8 pr-7 text-xs text-slate-700 placeholder:text-slate-400 focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/10 transition"
              />
              <button
                id="clearSearchBtn"
                type="button"
                onclick="clearFieldSearch()"
                class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"
              >
                <i data-lucide="x" class="h-3 w-3"></i>
              </button>
            </div>
            <div id="fieldSearchResults" class="mt-2 hidden max-h-48 overflow-y-auto space-y-1"></div>
          </div>

          <div class="px-3.5 pt-2.5 pb-1 flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Sections</span>
            <span class="font-mono text-[10px] font-semibold text-slate-400">07</span>
          </div>
          <nav id="sectionNavList" class="p-2 pt-1 space-y-0.5"></nav>
        </div>

        <!-- Profile Data Completeness Card -->
        <div class="rounded-2xl border border-slate-200/90 bg-white p-4 shadow-card">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <i data-lucide="check-circle-2" class="h-3.5 w-3.5 text-brand"></i>
              <span class="text-xs font-bold text-slate-800">Record Completeness</span>
            </div>
            <span id="sidebarCompletenessPct" class="font-mono text-xs font-bold text-brand">0%</span>
          </div>
          <div class="mt-2.5 h-1.5 w-full overflow-hidden rounded-full bg-slate-100">
            <div id="sidebarCompletenessBar" class="h-full rounded-full bg-gradient-to-r from-brand to-sky-500 transition-all duration-300" style="width: 0%"></div>
          </div>
          <p id="sidebarCompletenessNote" class="mt-2.5 text-[11px] leading-relaxed text-slate-500"></p>
          <div id="missingFieldsQuickList" class="mt-2.5 hidden flex-wrap gap-1.5"></div>
        </div>
      </aside>

      <!-- Main Section Cards Container -->
      <div class="w-full flex-1 min-w-0 space-y-4">
        <div id="sectionsContainer" class="space-y-4"></div>
      </div>
    </div>
  </main>

  <!-- FLOATING BOTTOM UNSAVED CHANGES DOCK -->
  <div id="unsavedBanner" class="no-print fixed bottom-5 left-1/2 z-40 hidden -translate-x-1/2 animate-in-up items-center gap-4 rounded-2xl border border-slate-300 bg-white/95 px-4 py-2.5 shadow-float backdrop-blur-md">
    <div class="flex items-center gap-2.5 text-xs">
      <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-amber-100 text-amber-700">
        <i data-lucide="edit-3" class="h-3.5 w-3.5"></i>
      </span>
      <div>
        <p class="font-bold text-slate-900">Unsaved Edits Active</p>
        <p id="unsavedBannerText" class="text-[11px] text-slate-500">Modify fields and save changes</p>
      </div>
    </div>
    <div class="h-6 w-px bg-slate-200"></div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="cancelAllEdits()" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
        Discard
      </button>
      <button type="button" onclick="saveAllEdits()" class="inline-flex items-center gap-1.5 rounded-lg bg-brand px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-brand-dark transition">
        <i data-lucide="check" class="h-3.5 w-3.5"></i>
        Save Changes
      </button>
    </div>
  </div>

  <!-- AUDIT LOG SLIDE-OVER DRAWER -->
  <div id="auditDrawerBackdrop" class="no-print fixed inset-0 z-50 hidden bg-slate-900/25 backdrop-blur-[2px] transition-opacity" onclick="closeAuditDrawer()"></div>
  <aside id="auditDrawer" class="no-print fixed inset-y-0 right-0 z-50 flex w-full max-w-md translate-x-full flex-col border-l border-slate-200 bg-white shadow-2xl transition-transform duration-300 ease-out">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 bg-slate-50/80">
      <div class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-brand-light text-brand border border-brand-border">
          <i data-lucide="history" class="h-4 w-4"></i>
        </span>
        <div>
          <h2 class="font-display text-sm font-bold text-slate-900">Change History & Audit Log</h2>
          <p class="text-[11px] text-slate-500">Tracked field updates with one-click revert</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="clearAuditLog()" class="rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-medium text-slate-600 hover:text-rose-600 hover:border-rose-200 transition">
          Clear
        </button>
        <button type="button" onclick="closeAuditDrawer()" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>
    </div>
    <div id="auditLogList" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
  </aside>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="no-print fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div th:replace="~{fragments/messenger :: chat-widget}"></div>

  <script>
    // =========================================================================
    // 1. API CONFIG, ENDPOINTS & DTO PROJECTION MAPPERS
    // =========================================================================
    const AUDIT_KEY = 'emp_profile_audit_v1';
    const urlParams = new URLSearchParams(window.location.search);
    const eid = urlParams.get('eid');

    const SECTION_ENDPOINTS = {
      'basic-info': '/admin/updateEmployee/basic',
      'joining-info': '/admin/updateEmployee/joining',
      'designation-info': '/admin/updateEmployee/designation',
      'statutory-info': '/admin/updateEmployee/statutory',
      'bank-info': '/admin/updateEmployee/bank',
      'education-info': '/admin/updateEmployee/education',
      'emergency-contact': '/admin/updateEmployee/emergency'
    };

    let reportingManagerOptions = [];
    let departmentOptions = [];
    let isLoadingProfile = Boolean(eid);

    const DEFAULT_AVATAR =
      'data:image/svg+xml;utf8,' +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
          <rect width="128" height="128" fill="#EEF3FF"/>
          <circle cx="64" cy="48" r="22" fill="#3B82F6"/>
          <path d="M24 114c0-22.091 17.909-40 40-40s40 17.909 40 40" fill="#1034A6"/>
        </svg>`
      );

    const EMPTY_EMPLOYEE = {
      avatarUrl: DEFAULT_AVATAR,
      EID: '',
      firstName: '',
      lastName: '',
      dob: '',
      gender: '',
      bloodGroup: '',
      maritalStatus: '',
      email: '',
      phone: '',
      address: '',
      dateOfJoining: '',
      confirmationDate: '',
      status: '',
      workmail: '',
      reportingManager: '',
      designation: '',
      department: '',
      adhar: '',
      pan: '',
      uan: '',
      pfNo: '',
      pfStartDate: '',
      esiNo: '',
      onSurity: 'No',
      bankName: '',
      branchName: '',
      accountNumber: '',
      IFSC: '',
      paymentMode: '',
      degree: '',
      fieldOfStudy: '',
      college: '',
      yearOfPassing: '',
      gpa: '',
      emergencyContactName: '',
      relation: '',
      emergencyContactNum: ''
    };

    function mapProjectionToEmployeeData(dto) {
      if (!dto) return { ...EMPTY_EMPLOYEE };

      return {
        avatarUrl: dto.image && String(dto.image).trim() !== '' ? dto.image : DEFAULT_AVATAR,
        EID: dto.employeeId ?? '',
        firstName: dto.firstName ?? '',
        lastName: dto.lastName ?? '',
        dob: dto.dob ? formatDisplayDate(dto.dob) : '',
        gender: dto.gender ?? '',
        bloodGroup: dto.bloodGroup ?? '',
        maritalStatus: dto.meritalStatus ?? '',
        email: dto.personalEmail ?? '',
        phone: dto.phone ?? '',
        address: dto.address ?? '',
        dateOfJoining: dto.dateOfJoining ? formatDisplayDate(dto.dateOfJoining) : '',
        confirmationDate: dto.confirmationDate ? formatDisplayDate(dto.confirmationDate) : '',
        status: dto.status ?? '',
        workmail: dto.workmail ?? '',
        reportingManager: dto.manager ?? '',
        designation: dto.designation ?? '',
        department: String(dto.departmentId ?? dto.department ?? dto.departmentName ?? ''),
        adhar: dto.aadhar ?? '',
        pan: dto.pan ?? '',
        uan: dto.uan ?? '',
        pfNo: dto.pfNo ?? '',
        pfStartDate: dto.pfStartDate ? formatDisplayDate(dto.pfStartDate) : '',
        esiNo: dto.esiNo ?? '',
        onSurity: dto.onSurity ?? 'No',
        bankName: dto.bankName ?? '',
        branchName: dto.branchName ?? '',
        accountNumber: dto.accountNumber ?? '',
        IFSC: dto.ifsc ?? dto.IFSC ?? '',
        paymentMode: dto.paymentMode ?? '',
        degree: dto.degree ?? '',
        fieldOfStudy: dto.fieldOfStudy ?? '',
        college: dto.college ?? '',
        yearOfPassing: dto.yearOfPassing ?? '',
        gpa: dto.gpa ?? '',
        emergencyContactName: dto.emergencyContactName ?? '',
        relation: dto.emergencyRelation ?? '',
        emergencyContactNum: dto.emergencyContactNum ?? ''
      };
    }

    function buildSectionPayload(sectionId, sourceObj) {

      const keyMap = {

        maritalStatus: 'meritalStatus',
        email: 'personalEmail',
        reportingManager: 'manager',
        department: 'departmentName',
        adhar: 'aadhar',
        relation: 'emergencyRelation',
        IFSC: 'ifsc'
      };

      const payload = {
        employeeId: employeeData.EID || eid

      sec.fields.forEach(f => {
        if (f.readonly) return;
        const backendKey = keyMap[f.key] || f.key;
        const raw = (sourceObj[f.key] ?? '').toString().trim();
        payload[backendKey] = f.type === 'date' ? toInputDateValue(raw) : raw;
      });

      return payload;

    // =========================================================================
    // 4. DATE PARSING, VALIDATION & FORMATTING HELPERS
    // =========================================================================
    const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function parseFlexibleDate(dateStr) {
      if (!dateStr) return null;
      const s = String(dateStr).trim();

      const dmyMatch = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
      if (dmyMatch) {
        const day = parseInt(dmyMatch[1], 10);
        const monthIdx = MONTHS_SHORT.findIndex(m => m.toLowerCase() === dmyMatch[2].toLowerCase());
        const year = parseInt(dmyMatch[3], 10);
        if (monthIdx !== -1) {
          const d = new Date(year, monthIdx, day);
          return isNaN(d.getTime()) ? null : d;
        }
      }

      const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) {
        const d = new Date(parseInt(isoMatch[1], 10), parseInt(isoMatch[2], 10) - 1, parseInt(isoMatch[3], 10));
        return isNaN(d.getTime()) ? null : d;
      }

      const fallback = new Date(s);
      return isNaN(fallback.getTime()) ? null : fallback;
    }

    function formatDisplayDate(dateStr) {
      const d = parseFlexibleDate(dateStr);
      if (!d) return dateStr ? String(dateStr) : '—';
      const dd = String(d.getDate()).padStart(2, '0');
      const mmm = MONTHS_SHORT[d.getMonth()];
      const yyyy = d.getFullYear();
      return `${dd}-${mmm}-${yyyy}`;
    }

    function toInputDateValue(dateStr) {
      const d = parseFlexibleDate(dateStr);
      if (!d) return '';
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function resolveSelectOptions(field, currentVal) {
      const rawList = typeof field.dynamicOptions === 'function'
        ? field.dynamicOptions()
        : (field.options || []);

      const normalized = rawList.map(opt =>
        typeof opt === 'object' && opt !== null
          ? { value: String(opt.value), label: String(opt.label ?? opt.value) }
          : { value: String(opt), label: String(opt) }
      );

      if (currentVal && !normalized.some(o => o.value === currentVal)) {
        normalized.unshift({ value: currentVal, label: currentVal });
      }
      return normalized;
    }

    function getSelectDisplayLabel(field, rawVal) {
      if (!rawVal) return '';
      const opts = resolveSelectOptions(field, rawVal);
      const match = opts.find(o => o.value === rawVal);
      return match ? match.label : rawVal;
    }

    function getFieldLabelByKey(key, rawVal) {
      if (!rawVal) return '';
      const field = PROFILE_SECTIONS.flatMap(s => s.fields).find(f => f.key === key);
      if (field && field.type === 'select') {
        return getSelectDisplayLabel(field, String(rawVal));
      }
      return String(rawVal);
    }

    function validateField(key, rawValue) {
      const fieldDef = PROFILE_SECTIONS.flatMap(s => s.fields).find(f => f.key === key);
      if (fieldDef && fieldDef.readonly) return '';

      const val = (rawValue ?? '').toString().trim();

      const requiredKeys = [
        'firstName', 'lastName', 'dob', 'email', 'phone',
        'dateOfJoining', 'status', 'workmail', 'reportingManager',
        'designation', 'department', 'bankName', 'accountNumber',
        'IFSC', 'emergencyContactName', 'relation', 'emergencyContactNum'
      ];
      if (requiredKeys.includes(key) && !val) {
        return 'This field is required';
      }

      if (!val) return '';

      if (key === 'email' || key === 'workmail') {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        if (!emailRegex.test(val)) return 'Enter a valid email address';
      }

      if (key === 'phone' || key === 'emergencyContactNum') {
        const digits = val.replace(/\D/g, '');
        if (digits.length < 10 || digits.length > 15) return 'Enter a valid 10–15 digit phone number';
      }

      if (key === 'adhar') {
        const digits = val.replace(/\s+/g, '');
        if (!/^\d{12}$/.test(digits)) return 'Aadhaar must be exactly 12 digits';
      }

      if (key === 'pan') {
        if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(val.toUpperCase())) return 'Invalid PAN format (e.g., ABCDE1234F)';
      }

      if (key === 'uan') {
        const digits = val.replace(/\s+/g, '');
        if (!/^\d{12}$/.test(digits)) return 'UAN must be 12 digits';
      }

      if (key === 'IFSC') {
        if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(val.toUpperCase())) return 'Invalid IFSC (e.g., HDFC0000184)';
      }

      if (key === 'accountNumber') {
        if (!/^\d{9,18}$/.test(val.replace(/\s+/g, ''))) return 'Account number must be 9–18 digits';
      }

      if (key === 'yearOfPassing') {
        const yr = parseInt(val, 10);
        if (!/^\d{4}$/.test(val) || yr < 1960 || yr > 2032) return 'Enter a valid 4-digit year';
      }

      return '';
    }

    function autoFormatInput(key, value) {
      if (key === 'pan' || key === 'IFSC') {
        return value.toUpperCase();
      }
      if (key === 'adhar') {
        const digits = value.replace(/\D/g, '').slice(0, 12);
        return digits.replace(/(\d{4})(?=\d)/g, '$1 ');
      }
      if (key === 'uan') {
        return value.replace(/\D/g, '').slice(0, 12);
      }
      return value;
    }

    function computeAge(dobStr) {
      const dob = parseFlexibleDate(dobStr);
      if (!dob) return null;
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
      return age >= 0 ? age : null;
    }

    function computeTenure(dojStr) {
      const start = parseFlexibleDate(dojStr);
      if (!start) return '—';
      const now = new Date();
      if (start > now) return 'Upcoming';
      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      if (now.getDate() < start.getDate()) months--;
      if (months < 0) {
        years--;
        months += 12;
      }
      if (years === 0 && months === 0) return 'Less than 1 mo';
      const parts = [];
      if (years > 0) parts.push(`${years} yr${years > 1 ? 's' : ''}`);
      if (months > 0) parts.push(`${months} mo${months > 1 ? 's' : ''}`);
      return parts.join(' ');
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function isFieldDirty(key) {
      if (editingSections.size === 0) return false;
      const oldVal = (employeeData[key] ?? '').toString().trim();
      const newVal = (draftData[key] ?? '').toString().trim();
      return oldVal !== newVal;
    }

    function countDirtyFields(sectionId = null) {
      if (editingSections.size === 0) return 0;
      const targetSecs = sectionId
        ? PROFILE_SECTIONS.filter(s => s.id === sectionId)
        : PROFILE_SECTIONS.filter(s => editingSections.has(s.id));

      let count = 0;
      targetSecs.forEach(sec => {
        sec.fields.forEach(f => {
          if (f.readonly) return;
          if (isFieldDirty(f.key)) count++;
        });
      });
      return count;
    }

      document.getElementById('kpiDobSub').textContent = `DOB: ${formatDisplayDate(employeeData.dob)}`;

      document.getElementById('kpiConfirm').textContent = employeeData.confirmationDate ? formatDisplayDate(employeeData.confirmationDate) : 'Pending';
      document.getElementById('kpiSuretySub').textContent = `On Surety: ${employeeData.onSurity || 'No'}`;

      // Hero Action Buttons
      const anyEditing = editingSections.size > 0;

      if (anyEditing) {
        actionWrap.innerHTML = `
          <button type="button" onclick="cancelAllEdits()" class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 shadow-2xs hover:bg-slate-50 transition">
            <i data-lucide="x" class="h-3.5 w-3.5 text-slate-500"></i>
            Cancel All
          </button>
          <button type="button" id="saveAllBtn" onclick="saveAllEdits()" class="inline-flex items-center gap-1.5 rounded-xl bg-brand px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-brand-dark transition">
            <i data-lucide="check-circle-2" class="h-3.5 w-3.5"></i>
            Save All
          </button>
        `;

        actionWrap.innerHTML = `
          <button type="button" onclick="startEditAll()" class="inline-flex items-center gap-2 rounded-xl bg-brand px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-brand-dark active:scale-[0.99] transition">
            <i data-lucide="pencil" class="h-3.5 w-3.5"></i>
            Edit Full Profile
          </button>
        `;
      }
    }

          <a
            href="#${sec.id}"
            onclick="setActiveNav('${sec.id}')"

                ? 'bg-brand-light/90 text-brand font-semibold'

          >
            ${isActive ? '<span class="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-r-full bg-brand"></span>' : ''}
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border ${
                isActive ? 'border-brand-border bg-white text-brand shadow-2xs' : 'border-slate-200/80 bg-slate-50 text-slate-500 group-hover:bg-white'
              }">

    function renderCompleteness() {
      const allFields = PROFILE_SECTIONS.flatMap(s => s.fields.map(f => ({ ...f, sectionId: s.id })));
      const missing = allFields.filter(f => !(employeeData[f.key] ?? '').toString().trim());
      const filled = allFields.length - missing.length;
      const pct = isLoadingProfile ? 0 : Math.round((filled / allFields.length) * 100);

      document.getElementById('sidebarCompletenessPct').textContent = `${pct}%`;
      document.getElementById('sidebarCompletenessBar').style.width = `${pct}%`;

      const noteEl = document.getElementById('sidebarCompletenessNote');
      const quickList = document.getElementById('missingFieldsQuickList');

      if (isLoadingProfile) {
        noteEl.textContent = 'Calculating profile completeness...';
        quickList.classList.add('hidden');
        return;
      }

      if (missing.length === 0) {
        noteEl.textContent = `All ${allFields.length} employee fields across 7 sections are populated.`;
        quickList.classList.add('hidden');
        quickList.innerHTML = '';
      } else {
        noteEl.textContent = `${filled} of ${allFields.length} fields completed. Click below to fill missing items:`;
        quickList.classList.remove('hidden');
        quickList.classList.add('flex');
        quickList.innerHTML = missing.slice(0, 6).map(m => `
          <button
            type="button"
            onclick="jumpAndEditField('${m.sectionId}', '${m.key}')"
            class="rounded-md border border-amber-200 bg-amber-50/80 px-2 py-0.5 text-[10px] font-medium text-amber-800 hover:bg-amber-100 transition"
          >
            + ${escapeHTML(m.label)}
          </button>
        `).join('');
      }
    }

    function renderFieldCell(sectionId, field, isEditing) {
      const colSpanClass = field.fullWidth ? 'md:col-span-2 xl:col-span-3' : '';

      if (!isEditing) {
        if (isLoadingProfile) {
          return `
            <div class="${colSpanClass} flex items-center justify-between gap-4 border-b border-slate-100 py-3">
              <span class="h-3.5 w-24 skeleton"></span>
              <span class="h-4 w-36 skeleton"></span>
            </div>
          `;
        }

        const rawVal = employeeData[field.key];
        const hasVal = rawVal !== undefined && rawVal !== null && String(rawVal).trim() !== '';
        const isSensitive = Boolean(field.sensitive) && hasVal;
        const isRevealed = revealedFields.has(field.key);
        let displayHTML = '';

        if (!hasVal) {
          displayHTML = `<span class="text-xs italic text-slate-400">Not provided</span>`;
        } else if (field.key === 'status') {
          displayHTML = getStatusBadgeHTML(rawVal);
        } else if (field.key === 'onSurity') {
          const isYes = rawVal === 'Yes';
          displayHTML = `<span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold ${
            isYes ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-slate-200 bg-slate-50 text-slate-700'
          }">${escapeHTML(rawVal)}</span>`;
        } else if (field.type === 'date') {
          const formatted = formatDisplayDate(rawVal);
          let extraPill = '';
          if (field.key === 'dob') {
            const age = computeAge(rawVal);
            if (age !== null) extraPill = `<span class="ml-2 rounded bg-slate-100 px-1.5 py-0.5 text-[11px] font-medium text-slate-600">${age} yrs</span>`;
          } else if (field.key === 'dateOfJoining') {
            extraPill = `<span class="ml-2 rounded bg-brand-light px-1.5 py-0.5 text-[11px] font-semibold text-brand">${computeTenure(rawVal)}</span>`;
          }
          displayHTML = `<span class="text-[13px] sm:text-sm font-semibold text-slate-800">${escapeHTML(formatted)}</span>${extraPill}`;
        } else if (field.type === 'select') {
          const displayLabel = getSelectDisplayLabel(field, String(rawVal));
          displayHTML = `<span class="${field.mono ? 'font-mono text-[13px]' : 'text-[13px] sm:text-sm'} font-semibold text-slate-800 break-words">${escapeHTML(displayLabel)}</span>`;
        } else {
          const shownText = isSensitive && !isRevealed ? maskSensitiveValue(field.key, rawVal) : String(rawVal);
          displayHTML = `<span class="${field.mono ? 'font-mono text-[13px]' : 'text-[13px] sm:text-sm'} font-semibold text-slate-800 break-words">${escapeHTML(shownText)}</span>`;
        }

        const copyValue = field.type === 'select' && hasVal
          ? getSelectDisplayLabel(field, String(rawVal))
          : String(rawVal ?? '');

        return `
          <div id="field_row_${field.key}" class="${colSpanClass} group flex items-start sm:items-center justify-between gap-3 border-b border-slate-100 py-2.5 px-2.5 -mx-2.5 rounded-lg hover:bg-slate-50/90 transition">
            <span class="shrink-0 text-xs font-medium text-slate-500 pt-0.5 sm:pt-0">${escapeHTML(field.label)}</span>
            <div class="flex items-center justify-end gap-1.5 min-w-0 text-right">
              <div class="flex items-center justify-end flex-wrap min-w-0">
                ${displayHTML}
              </div>
              <div class="no-print flex items-center gap-0.5 shrink-0">
                ${
                  isSensitive
                    ? `<button type="button" onclick="toggleSensitiveField('${field.key}')" class="rounded p-1 text-slate-400 hover:bg-white hover:text-brand transition" title="${isRevealed ? 'Hide' : 'Show'} ${escapeHTML(field.label)}">
                        <i data-lucide="${isRevealed ? 'eye-off' : 'eye'}" class="h-3.5 w-3.5"></i>
                      </button>`
                    : ''
                }
                ${
                  hasVal
                    ? `<button type="button" onclick="copyText(${JSON.stringify(copyValue)}, ${JSON.stringify(field.label)})" class="opacity-0 group-hover:opacity-100 rounded p-1 text-slate-400 hover:bg-white hover:text-brand transition" title="Copy ${escapeHTML(field.label)}">
                        <i data-lucide="copy" class="h-3 w-3"></i>
                      </button>`
                    : ''
                }
                ${
                  !field.readonly
                    ? `<button type="button" onclick="jumpAndEditField('${sectionId}', '${field.key}')" class="opacity-0 group-hover:opacity-100 rounded p-1 text-slate-400 hover:bg-white hover:text-brand transition" title="Quick edit ${escapeHTML(field.label)}">
                        <i data-lucide="pencil" class="h-3 w-3"></i>
                      </button>`
                    : ''
                }
              </div>
            </div>
          </div>
        `;
      }

      // READ-ONLY FIELD IN EDIT MODE
      if (field.readonly) {
        const lockedVal = employeeData[field.key] ?? eid ?? '';
        return `
          <div class="${colSpanClass}">
            <label for="input_${field.key}" class="mb-1 flex items-center justify-between text-xs font-semibold text-slate-500">
              <span>${escapeHTML(field.label)}</span>
              <span class="inline-flex items-center gap-1 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500">
                <i data-lucide="lock" class="h-2.5 w-2.5"></i>
                Locked
              </span>
            </label>
            <input
              id="input_${field.key}"
              type="text"
              value="${escapeHTML(lockedVal)}"
              readonly
              disabled
              class="w-full cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100/80 ${field.mono ? 'font-mono text-[13px]' : 'text-sm'} px-3 py-2 font-semibold text-slate-500 select-all"
            />
          </div>
        `;
      }

      // EDIT MODE INPUT
      const currentVal = draftData[field.key] ?? '';
      const errorMsg = fieldErrors[field.key] || '';
      const dirty = isFieldDirty(field.key);
      const isValid = !errorMsg && String(currentVal).trim() !== '';

      const borderClass = errorMsg
        ? 'border-rose-400 bg-rose-50/30 focus:border-rose-500'
        : dirty
          ? 'border-brand border-l-[3px] bg-brand-light/15'
          : isValid
            ? 'border-slate-300 bg-white'
            : 'border-slate-300 bg-white';

      let controlHTML = '';
      if (field.type === 'select') {
        const mergedOpts = resolveSelectOptions(field, currentVal);
        let matchedFirst = false;
        controlHTML = `
          <select
            id="input_${field.key}"
            onchange="handleFieldInput('${field.key}', this.value)"
            class="field-input w-full rounded-lg border ${borderClass} px-3 py-2 text-sm font-medium text-slate-800"
          >
            <option value="">Select ${escapeHTML(field.label)}</option>
            ${mergedOpts.map(opt => {
              const isSelected = !matchedFirst && currentVal === opt.value;
              if (isSelected) matchedFirst = true;
              return `<option value="${escapeHTML(opt.value)}" ${isSelected ? 'selected' : ''}>${escapeHTML(opt.label)}</option>`;
            }).join('')}
          </select>
        `;
      } else if (field.type === 'textarea') {
        controlHTML = `
          <textarea
            id="input_${field.key}"
            rows="2"
            placeholder="${escapeHTML(field.placeholder || '')}"
            oninput="handleFieldInput('${field.key}', this.value)"
            class="field-input w-full rounded-lg border ${borderClass} px-3 py-2 text-sm font-medium text-slate-800"
          >${escapeHTML(currentVal)}</textarea>
        `;
      } else {
        const inputVal = field.type === 'date' ? toInputDateValue(currentVal) : currentVal;
        controlHTML = `
          <div class="relative">
            <input
              id="input_${field.key}"
              type="${field.type || 'text'}"
              value="${escapeHTML(inputVal)}"
              placeholder="${escapeHTML(field.placeholder || '')}"
              oninput="handleFieldInput('${field.key}', this.value)"
              class="field-input w-full rounded-lg border ${borderClass} ${field.mono ? 'font-mono text-[13px]' : 'text-sm'} px-3 py-2 pr-8 font-medium text-slate-800"
            />
            ${
              dirty && !errorMsg
                ? `<span class="pointer-events-none absolute inset-y-0 right-2.5 flex items-center text-brand" title="Modified">
                    <span class="h-2 w-2 rounded-full bg-brand"></span>
                  </span>`
                : ''
            }
          </div>
        `;
      }

      return `
        <div class="${colSpanClass}">
          <label for="input_${field.key}" class="mb-1 flex items-center justify-between text-xs font-semibold text-slate-700">
            <span>
              ${escapeHTML(field.label)}
              ${field.required ? '<span class="text-rose-500 ml-0.5">*</span>' : ''}
            </span>
            ${dirty ? '<span class="text-[10px] font-semibold text-brand">Modified</span>' : ''}
          </label>
          ${controlHTML}
          <p id="err_${field.key}" class="mt-1 text-[11px] font-medium text-rose-600 ${errorMsg ? '' : 'hidden'}">${escapeHTML(errorMsg)}</p>
        </div>
      `;
    }

    // =========================================================================
    // 6. QUICK-FIND FIELD SEARCH
    // =========================================================================
    function handleFieldSearch(query) {
      const q = String(query || '').trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      const resultsEl = document.getElementById('fieldSearchResults');

      clearBtn.classList.toggle('hidden', q.length === 0);

      if (!q) {
        resultsEl.classList.add('hidden');
        resultsEl.innerHTML = '';
        return;
      }

      const matches = [];
      PROFILE_SECTIONS.forEach(sec => {
        sec.fields.forEach(f => {
          if (f.label.toLowerCase().includes(q) || f.key.toLowerCase().includes(q)) {
            matches.push({ sectionId: sec.id, sectionTitle: sec.title, field: f });
          }
        });
      });

      resultsEl.classList.remove('hidden');
      if (matches.length === 0) {
        resultsEl.innerHTML = `<p class="px-2 py-1.5 text-[11px] text-slate-400">No matching fields</p>`;
        return;
      }

      resultsEl.innerHTML = matches.slice(0, 8).map(m => `
        <button
          type="button"
          onclick="jumpToField('${m.sectionId}', '${m.field.key}')"
          class="flex w-full items-center justify-between rounded-lg px-2 py-1.5 text-left text-xs hover:bg-brand-light/70 transition"
        >
          <span class="font-medium text-slate-800 truncate">${escapeHTML(m.field.label)}</span>
          <span class="ml-2 shrink-0 text-[10px] text-slate-400">${escapeHTML(m.sectionTitle)}</span>
        </button>
      `).join('');
    }

    function clearFieldSearch() {
      const input = document.getElementById('fieldSearchInput');
      input.value = '';
      handleFieldSearch('');
    }

    function jumpToField(sectionId, fieldKey) {
      clearFieldSearch();
      setActiveNav(sectionId);
      const row = document.getElementById(`field_row_${fieldKey}`) || document.getElementById(`input_${fieldKey}`) || document.getElementById(sectionId);
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.remove('field-flash');
        void row.offsetWidth;
        row.classList.add('field-flash');
      }
    }

    // =========================================================================
    // 7. EDITING, AJAX MODIFICATION, VALIDATION & AUDIT LOG ACTIONS
    // =========================================================================
    function startSectionEdit(sectionId) {
      if (editingSections.size === 0) {
        draftData = { ...employeeData };
        fieldErrors = {};
      } else {
        const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
        if (sec) {
          sec.fields.forEach(f => {
            draftData[f.key] = employeeData[f.key] ?? '';
            delete fieldErrors[f.key];
          });
        }
      }
      editingSections.add(sectionId);
      activeNavId = sectionId;
      renderAll();
    }

    function startEditAll() {
      draftData = { ...employeeData };
      fieldErrors = {};
      PROFILE_SECTIONS.forEach(s => editingSections.add(s.id));
      renderAll();
      showToast('Full profile edit mode enabled', 'info');
    }

    function cancelSectionEdit(sectionId) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
      if (sec) {
        sec.fields.forEach(f => {
          delete draftData[f.key];
          delete fieldErrors[f.key];
        });
      }
      editingSections.delete(sectionId);
      renderAll();
      showToast(`Discarded edits in ${sec ? sec.title : 'section'}`, 'info');
    }

    function cancelAllEdits() {
      editingSections.clear();
      draftData = {};
      fieldErrors = {};
      renderAll();
      showToast('All unsaved changes discarded', 'info');
    }

    function handleFieldInput(key, rawValue) {
      const fieldDef = PROFILE_SECTIONS.flatMap(s => s.fields).find(f => f.key === key);
      if (fieldDef && fieldDef.readonly) return;

      const isDateField = fieldDef && fieldDef.type === 'date';
      const normalizedVal = isDateField && rawValue ? formatDisplayDate(rawValue) : rawValue;
      const formatted = autoFormatInput(key, normalizedVal);
      draftData[key] = formatted;

      const inputEl = document.getElementById(`input_${key}`);
      if (!isDateField && inputEl && inputEl.value !== formatted) {
        inputEl.value = formatted;
      }

      const err = validateField(key, formatted);
      if (err) {
        fieldErrors[key] = err;
      } else {
        delete fieldErrors[key];
      }

      const errEl = document.getElementById(`err_${key}`);
      if (errEl) {
        errEl.textContent = err;
        errEl.classList.toggle('hidden', !err);
      }
      if (inputEl) {
        const dirty = isFieldDirty(key);
        inputEl.classList.toggle('border-rose-400', Boolean(err));
        inputEl.classList.toggle('bg-rose-50/30', Boolean(err));
        inputEl.classList.toggle('border-brand', !err && dirty);
        inputEl.classList.toggle('border-l-[3px]', !err && dirty);
      }
      updateUnsavedBanner();
    }

    function saveSectionEdit(sectionId) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
      if (!sec) return;

      let hasError = false;
      sec.fields.forEach(f => {
        if (f.readonly) return;
        const err = validateField(f.key, draftData[f.key]);
        if (err) {
          fieldErrors[f.key] = err;
          hasError = true;
        } else {
          delete fieldErrors[f.key];
        }
      });

      if (hasError) {
        renderSections();
        if (window.lucide) lucide.createIcons();
        showToast(`Please fix validation errors in ${sec.title}`, 'error');
        return;
      }

      const hasChanges = sec.fields.some(f => !f.readonly && isFieldDirty(f.key));

      if (!hasChanges) {
        editingSections.delete(sectionId);
        renderAll();
        showToast(`No changes made in ${sec.title}`, 'info');
        return;
      }

      const payload = buildSectionPayload(sectionId, draftData);
      const saveBtn = document.getElementById(`saveBtn_${sectionId}`);
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span class="animate-pulse">Saving...</span>`;
      }

      sendSectionUpdateRequest(sectionId, payload)
        .done(() => {
          let changesCount = 0;
          sec.fields.forEach(f => {
            if (f.readonly) return;
            const oldVal = (employeeData[f.key] ?? '').toString().trim();
            const newVal = (draftData[f.key] ?? '').toString().trim();
            if (oldVal !== newVal) {
              employeeData[f.key] = newVal;
              recordAuditEntry(sec.title, f.key, f.label, oldVal, newVal);
              changesCount++;
            }
          });

          editingSections.delete(sectionId);
          renderAll();
          showToast(`Saved ${changesCount} update${changesCount > 1 ? 's' : ''} in ${sec.title}`, 'success');
        })
        .fail((xhr) => {
          const msg = xhr.responseJSON?.message || `Failed to save ${sec.title}`;
          showToast(msg, 'error');
          renderSections();
          if (window.lucide) lucide.createIcons();
        });
    }

    function saveAllEdits() {
      const activeSecs = PROFILE_SECTIONS.filter(s => editingSections.has(s.id));
      let hasError = false;

      activeSecs.forEach(sec => {
        sec.fields.forEach(f => {
          if (f.readonly) return;
          const err = validateField(f.key, draftData[f.key]);
          if (err) {
            fieldErrors[f.key] = err;
            hasError = true;
          } else {
            delete fieldErrors[f.key];
          }
        });
      });

      if (hasError) {
        renderSections();
        if (window.lucide) lucide.createIcons();
        showToast('Please resolve highlighted validation errors before saving', 'error');
        return;
      }

      const modifiedSecs = activeSecs.filter(sec =>
        sec.fields.some(f => !f.readonly && isFieldDirty(f.key))
      );

      if (modifiedSecs.length === 0) {
        editingSections.clear();
        draftData = {};
        fieldErrors = {};
        renderAll();
        showToast('Profile is up to date', 'info');
        return;
      }

      const saveAllBtn = document.getElementById('saveAllBtn');
      if (saveAllBtn) {
        saveAllBtn.disabled = true;
        saveAllBtn.innerHTML = `<span class="animate-pulse">Saving All...</span>`;
      }

      const requests = modifiedSecs.map(sec => {
        const payload = buildSectionPayload(sec.id, draftData);
        return sendSectionUpdateRequest(sec.id, payload);
      });

      $.when(...requests)
        .done(() => {
          let totalChanges = 0;
          modifiedSecs.forEach(sec => {
            sec.fields.forEach(f => {
              if (f.readonly) return;
              const oldVal = (employeeData[f.key] ?? '').toString().trim();
              const newVal = (draftData[f.key] ?? '').toString().trim();
              if (oldVal !== newVal) {
                employeeData[f.key] = newVal;
                recordAuditEntry(sec.title, f.key, f.label, oldVal, newVal);
                totalChanges++;
              }
            });
          });

          editingSections.clear();
          draftData = {};
          fieldErrors = {};
          renderAll();
          showToast(`Saved ${totalChanges} profile update${totalChanges > 1 ? 's' : ''}`, 'success');
        })
        .fail((xhr) => {
          const msg = xhr.responseJSON?.message || 'One or more sections failed to save';
          showToast(msg, 'error');
          renderAll();
        });
    }

    function jumpAndEditField(sectionId, fieldKey) {
      startSectionEdit(sectionId);
      setTimeout(() => {
        const input = document.getElementById(`input_${fieldKey}`);
        if (input) {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (!input.disabled) input.focus();
        }
      }, 60);
    }

    function setActiveNav(sectionId) {
      activeNavId = sectionId;
      renderSidebarNav();
      if (window.lucide) lucide.createIcons();
    }

    function updateUnsavedBanner() {
      const banner = document.getElementById('unsavedBanner');
      if (editingSections.size > 0) {
        const dirtyCount = countDirtyFields();
        banner.classList.remove('hidden');
        banner.classList.add('flex');
        document.getElementById('unsavedBannerText').textContent =
          `${editingSections.size} section${editingSections.size > 1 ? 's' : ''} open • ${dirtyCount} field${dirtyCount !== 1 ? 's' : ''} modified (Ctrl+S to save)`;
      } else {
        banner.classList.add('hidden');
        banner.classList.remove('flex');
      }
    }

    // =========================================================================
    // 8. AUDIT LOG & REVERT ENGINE
    // =========================================================================
    function recordAuditEntry(sectionTitle, key, label, oldVal, newVal) {
      auditLogs.unshift({
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        timestamp: new Date().toISOString(),
        section: sectionTitle,
        key,
        label,
        oldVal: oldVal || '(empty)',
        newVal: newVal || '(empty)'
      });
      if (auditLogs.length > 60) auditLogs = auditLogs.slice(0, 60);
      persistAuditLogs();
    }

    function renderAuditBadge() {
      document.getElementById('auditCountBadge').textContent = auditLogs.length;
    }

    function openAuditDrawer() {
      renderAuditList();
      document.getElementById('auditDrawerBackdrop').classList.remove('hidden');
      document.getElementById('auditDrawer').classList.remove('translate-x-full');
      if (window.lucide) lucide.createIcons();
    }

    function closeAuditDrawer() {
      document.getElementById('auditDrawerBackdrop').classList.add('hidden');
      document.getElementById('auditDrawer').classList.add('translate-x-full');
    }

    function renderAuditList() {
      const list = document.getElementById('auditLogList');
      if (auditLogs.length === 0) {
        list.innerHTML = `
          <div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-200 bg-slate-50/60 px-6 py-12 text-center">
            <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-slate-400 shadow-2xs border border-slate-200/80">
              <i data-lucide="history" class="h-5 w-5"></i>
            </span>
            <p class="mt-3 text-xs font-semibold text-slate-700">No recorded edits yet</p>
            <p class="mt-1 text-[11px] text-slate-500">Every field edit you save will appear here with timestamps and one-click revert.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = auditLogs.map(item => {
        const dt = new Date(item.timestamp);
        const timeStr = isNaN(dt.getTime())
          ? ''
          : dt.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

        return `
          <div class="rounded-xl border border-slate-200/90 bg-slate-50/50 p-3.5">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-md bg-brand-light px-2 py-0.5 text-[10px] font-bold text-brand border border-brand-border">
                ${escapeHTML(item.section)}
              </span>
              <span class="font-mono text-[10px] text-slate-400">${escapeHTML(timeStr)}</span>
            </div>
            <p class="mt-2 text-xs font-semibold text-slate-800">
              ${escapeHTML(item.label)}
              <span class="ml-1 font-mono text-[10px] font-normal text-slate-400">(${escapeHTML(item.key)})</span>
            </p>
            <div class="mt-2 space-y-1 rounded-lg border border-slate-200/70 bg-white p-2 text-[11px]">
              <div class="flex items-start gap-1.5 text-rose-600">
                <span class="font-mono font-bold">-</span>
                <span class="break-all line-through opacity-80">${escapeHTML(item.oldVal)}</span>
              </div>
              <div class="flex items-start gap-1.5 text-emerald-700">
                <span class="font-mono font-bold">+</span>
                <span class="break-all font-medium">${escapeHTML(item.newVal)}</span>
              </div>
            </div>
            <div class="mt-2.5 flex justify-end">
              <button
                type="button"
                onclick="revertAuditEntry('${item.id}')"
                class="inline-flex items-center gap-1 rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-700 hover:border-brand-border hover:text-brand transition"
              >
                <i data-lucide="undo-2" class="h-3 w-3"></i>
                Revert Value
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function revertAuditEntry(logId) {
      const entry = auditLogs.find(l => l.id === logId);
      if (!entry) return;
      const sec = PROFILE_SECTIONS.find(s => s.title === entry.section);
      if (!sec) return;

      const restored = entry.oldVal === '(empty)' ? '' : entry.oldVal;
      const current = (employeeData[entry.key] ?? '').toString();
      const updatedSnapshot = { ...employeeData, [entry.key]: restored };
      const payload = buildSectionPayload(sec.id, updatedSnapshot);

      sendSectionUpdateRequest(sec.id, payload)
        .done(() => {
          employeeData[entry.key] = restored;
          if (editingSections.size > 0) {
            draftData[entry.key] = restored;
          }
          recordAuditEntry(entry.section, entry.key, entry.label, current, restored);
          renderAll();
          renderAuditList();
          if (window.lucide) lucide.createIcons();
          showToast(`Reverted ${entry.label}`, 'success');
        })
        .fail(() => {
          showToast(`Failed to revert ${entry.label} on server`, 'error');
        });
    }

    function clearAuditLog() {
      auditLogs = [];
      persistAuditLogs();
      renderAuditBadge();
      renderAuditList();
      if (window.lucide) lucide.createIcons();
      showToast('Audit log cleared', 'info');
    }

    // =========================================================================
    // 9. AVATAR UPLOAD, EXPORT, CLIPBOARD & UTILITIES
    // =========================================================================
    function handleAvatarUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please select a valid image file', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = function (e) {
        employeeData.avatarUrl = e.target.result;
        renderHero();
        if (window.lucide) lucide.createIcons();
        showToast('Profile photo updated', 'success');
      };
      reader.readAsDataURL(file);
    }

    function copyText(text, label) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copied to clipboard`, 'success');
      }).catch(() => {
        showToast('Unable to copy to clipboard', 'error');
      });
    }

    function copySectionData(sectionId) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
      if (!sec) return;
      const lines = sec.fields.map(f => {
        const raw = employeeData[f.key];
        const val = f.type === 'select' && raw ? getSelectDisplayLabel(f, String(raw)) : (raw || '—');
        return `${f.label} (${f.key}): ${val}`;
      });
      copyText(`${sec.title}\n${lines.join('\n')}`, `${sec.title} details`);
    }

    function exportProfileJSON() {
      const payload = {};
      PROFILE_SECTIONS.forEach(sec => {
        sec.fields.forEach(f => {
          const raw = employeeData[f.key] ?? '';
          payload[f.key] = f.type === 'date' ? toInputDateValue(raw) : raw;
        });
      });
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${employeeData.EID || 'employee'}_profile.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported employee profile JSON', 'success');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const styles = {
        success: 'border-emerald-200 bg-white text-slate-800 shadow-float',
        error: 'border-rose-200 bg-white text-slate-800 shadow-float',
        info: 'border-slate-200 bg-white text-slate-800 shadow-float'
      };
      const iconMap = {
        success: '<span class="flex h-6 w-6 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600"><i data-lucide="check" class="h-3.5 w-3.5"></i></span>',
        error: '<span class="flex h-6 w-6 items-center justify-center rounded-lg bg-rose-50 text-rose-600"><i data-lucide="alert-circle" class="h-3.5 w-3.5"></i></span>',
        info: '<span class="flex h-6 w-6 items-center justify-center rounded-lg bg-brand-light text-brand"><i data-lucide="info" class="h-3.5 w-3.5"></i></span>'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto animate-in-up flex items-center gap-2.5 rounded-xl border px-3.5 py-2.5 text-xs font-semibold ${styles[type] || styles.info}`;
      toast.innerHTML = `${iconMap[type] || iconMap.info}<span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2800);
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        if (editingSections.size > 0) {
          e.preventDefault();
          saveAllEdits();
        }
      } else if (e.key === 'Escape') {
        const drawer = document.getElementById('auditDrawer');
        if (!drawer.classList.contains('translate-x-full')) {
          closeAuditDrawer();
        } else if (editingSections.size > 0) {
          cancelAllEdits();
        }
      }
    });

    window.addEventListener('scroll', () => {
      let current = PROFILE_SECTIONS[0].id;
      for (const sec of PROFILE_SECTIONS) {
        const el = document.getElementById(sec.id);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= 140) current = sec.id;
        }
      }
      if (current !== activeNavId) {
        activeNavId = current;
        renderSidebarNav();
        if (window.lucide) lucide.createIcons();
      }
    }, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
      fetchReportingManagers();
      fetchDepartments();
      getData();
    });
  </script>
</body>
</html>
