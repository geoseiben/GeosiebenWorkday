<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 1);
            border: 1px solid rgba(226, 232, 240, 1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mini-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        
        .mini-tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
        }

        .hidden-modal {
            display: none !important;
        }

        .status-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .dept-tag {
            font-size: 8px;
            font-weight: 700;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .compact-row:hover {
            background-color: #f1f5f9;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }
    </style>
    <head th:replace="includes/header :: header"></head>

</head>

<body class="p-4 md:p-8">
    <div class="mx-auto" style="padding-left:40px;">
        <!-- Main Dashboard Header -->
        <header class="mb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-6">

                </div>
                <div>

            <div class="flex flex-wrap items-center gap-3">

                    <i class="fas fa-calendar-day absolute left-3 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="date" id="datePicker" class="pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 focus:outline-none bg-white shadow-sm font-semibold text-slate-700 transition-all cursor-pointer">

        <!-- Dynamic Summary Section -->
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-8">

            <div class="glass-card p-4 rounded-2xl relative overflow-hidden group">

                </div>

            <div class="glass-card p-4 rounded-2xl relative overflow-hidden group">
                <p class="text-[10px] font-bold text-purple-500 uppercase tracking-wider mb-1">Leave</p>

                <div class="mt-2 h-1.5 w-full bg-purple-50 rounded-full overflow-hidden">

        <!-- Toolbar: Search, View Toggle & Filters -->

                           class="w-full pl-12 pr-4 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 focus:outline-none shadow-sm bg-white transition-all text-sm font-medium">

            <div class="flex bg-white p-1 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto no-scrollbar">

                <button onclick="setFilter('Present')" class="filter-btn px-6 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-700 transition-all whitespace-nowrap">Present</button>
                <button onclick="setFilter('Absent')" class="filter-btn px-6 py-2 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-700 transition-all whitespace-nowrap">Absent</button>

    <!-- Attendance Modal (Grid Mode) -->

<div th:replace="~{fragments/messenger :: chat-widget}"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        let employees = []; // Populated via AJAX
        let currentSelectedDate = new Date().toISOString().split('T')[0];
        let currentEditingEmpId = null;
        let activeFilter = 'all';
        let currentView = 'grid';

        const grid = document.getElementById('employeeGrid');
        const compactContainer = document.getElementById('compactView');
        const compactListBody = document.getElementById('compactListBody');
        const datePicker = document.getElementById('datePicker');
        const searchInput = document.getElementById('employeeSearch');
        const modal = document.getElementById('attendanceModal');
        const dateDisplay = document.getElementById('current-date-display');
        const emptyState = document.getElementById('emptyState');

        window.onload = () => {
            datePicker.value = currentSelectedDate;
            updateDateLabel();
            fetchAttendenceRecords(currentSelectedDate);

            datePicker.addEventListener('change', (e) => {
                const selectedDate = e.target.value;
                const restriction = isRestrictedDate(selectedDate);
                
                if (restriction) {
                    showToast(restriction, "fa-triangle-exclamation");
                    // Reset picker to previous valid date
                    datePicker.value = currentSelectedDate;
                    return;
                }

                currentSelectedDate = selectedDate;
                updateDateLabel();
                fetchAttendenceRecords(currentSelectedDate);
            });

            searchInput.addEventListener('input', render);
        };

        /**
         * Checks if the date is a Sunday, 2nd Saturday, or Last Saturday
         * Returns a message string if restricted, null otherwise.
         */
        function isRestrictedDate(dateString) {
            const dateObj = new Date(dateString);
            const dayOfWeek = dateObj.getDay(); // 0: Sunday, 6: Saturday
            const dayOfMonth = dateObj.getDate();
            const month = dateObj.getMonth();
            const year = dateObj.getFullYear();

            // 1. Check if Sunday
            if (dayOfWeek === 0) return "Sundays are weekly holidays.";

            // 2. Check if Saturday
            if (dayOfWeek === 6) {
                // Determine if it's the 2nd Saturday
                // (Day 8 to 14 inclusive)
                if (dayOfMonth >= 8 && dayOfMonth <= 14) {
                    return "2nd Saturday is a holiday.";
                }

                // Determine if it's the Last Saturday
                // Add 7 days to current date, if month changes, it's the last Saturday
                const nextWeek = new Date(year, month, dayOfMonth + 7);
                if (nextWeek.getMonth() !== month) {
                    return "Last Saturday is a holiday.";
                }
            }

            return null;
        }

        function fetchAttendenceRecords(date){  
            $.ajax({
                url:'/admin/getAttendanceData',
                type:'GET',
                data:{date:date},
                dataType:'JSON',
                success:(res)=>{
                    employees = res.map(emp => ({
                        id: emp.eid,
                        name: emp.firstName+' '+emp.lastName,
                        status: emp.status || null, // null means pending
                        initials: (emp.firstName+' '+emp.lastName).split(' ').map(n => n[0]).join('').substring(0,2),

                    }));
                    render();
                    updateStats();
                },                
                error:(err)=>{
                    console.error("Failed to fetch attendance:", err);
                    showToast("Error loading data", "fa-triangle-exclamation");
                }
            })
        }

        function updateDateLabel() {
            const date = new Date(currentSelectedDate);
            const today = new Date().toISOString().split('T')[0];
            const isToday = currentSelectedDate === today;
            dateDisplay.innerHTML = `${isToday ? '<span class="text-blue-600 font-bold mr-2">Today,</span>' : ''}${date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}`;
        }

        function setView(view) {
            currentView = view;
            const gridBtn = document.getElementById('view-grid-btn');
            const compactBtn = document.getElementById('view-compact-btn');
            
            if(view === 'grid') {
                gridBtn.className = "w-10 h-10 rounded-lg flex items-center justify-center bg-white shadow-sm text-blue-600 transition-all";
                compactBtn.className = "w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-700 transition-all";
                grid.classList.remove('hidden');
                compactContainer.classList.add('hidden');
            } else {
                gridBtn.className = "w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-700 transition-all";
                compactBtn.className = "w-10 h-10 rounded-lg flex items-center justify-center bg-white shadow-sm text-blue-600 transition-all";
                grid.classList.add('hidden');
                compactContainer.classList.remove('hidden');
            }
            render();
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-100');
                btn.classList.add('text-slate-500');
                if(btn.innerText.toLowerCase() === filter.toLowerCase()) {
                    btn.classList.remove('text-slate-500');
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-100');
                }
            });
            render();
        }

        function getFilteredEmployees() {
            const searchTerm = searchInput.value.toLowerCase();
            let filtered = employees.filter(emp => emp.name.toLowerCase().includes(searchTerm));

            if (activeFilter !== 'all') {
                filtered = filtered.filter(emp => {
                    if (activeFilter === 'pending') return !emp.status;
                    return emp.status === activeFilter;
                });
            }
            return filtered;
        }

        function render() {
            const filtered = getFilteredEmployees();
            
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                compactContainer.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                if(currentView === 'grid') grid.classList.remove('hidden');
                else compactContainer.classList.remove('hidden');
            }

            if(currentView === 'grid') renderGridView(filtered);
            else renderCompactView(filtered);
        }
function getStatusSpan(status) {
  const colors = {
    'Present': 'green',
    'Absent': 'red',
    'Leave': 'purple',
    'Null': 'gray'
  };

  // Setup the base style with the smaller font size
  const baseStyle = 'font-size: 12px; font-weight: bold;';

  if (!status || status === 'Null') {
    return `<span style="color: ${colors.Null}; ${baseStyle}">Pending</span>`;
  }

  // Handle multi-status strings (e.g., 'Leave/Present')
  const parts = status.split('/');

  const styledParts = parts.map(part => {
    const color = colors[part] || 'black';
    return `<span style="color: ${color}; ${baseStyle}">${part}</span>`;
  });

  // Join parts with a standard black slash
  return styledParts.join(`<span style="color: black; ${baseStyle}">/</span>`);
}

// Example usage:
// element.innerHTML = getStatusSpan('Leave/Present');

        function renderGridView(filtered) {
            grid.innerHTML = '';
            filtered.forEach((emp, index) => {
                const config = getStatusConfig(emp.status);
                const tile = document.createElement('div');
                tile.className = `mini-tile glass-card p-3 rounded-2xl flex flex-col items-center text-center cursor-pointer relative border-b-4 ${config.border} animate-fade-in`;
                tile.style.animationDelay = `${index * 10}ms`;
                tile.onclick = () => openModal(emp);
                
                const avatarContent = emp.image 
                    ? `<img src="${emp.image}" class="avatar-img" onerror="this.outerHTML='${emp.initials}'">` 
                    : emp.initials;

                tile.innerHTML = `
                    <div class="relative mb-2">
                        <div class="w-10 h-10 rounded-xl bg-slate-200 flex items-center justify-center text-slate-600 text-[11px] font-black shadow-sm overflow-hidden">
                            ${avatarContent}
                        </div>
                        ${emp.status ? `<div class="absolute -right-1 -bottom-1 w-4 h-4 bg-white rounded-full flex items-center justify-center  shadow-sm">
                            <i class="${config.icon} ${config.text} text-[8px]"></i>
                        </div>` : ''}
                    </div>
                    <h3 class="font-bold text-slate-800 text-[10px] w-full truncate leading-tight">${emp.name}</h3>
                    <div class="flex items-center gap-1 mt-1.5">
${getStatusSpan(emp.status)}
                    </div>
                `;
                grid.appendChild(tile);
            });
        }

        function renderCompactView(filtered) {
            compactListBody.innerHTML = '';
            filtered.forEach((emp) => {
                const config = getStatusConfig(emp.status);
                const row = document.createElement('tr');
                row.className = "compact-row border-b border-slate-50 transition-colors";
                
                const avatarContent = emp.image 
                    ? `<img src="${emp.image}" class="avatar-img" onerror="this.parentElement.innerText='${emp.initials}'">` 
                    : emp.initials;

                row.innerHTML = `
                    <td class="px-6 py-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 text-[10px] font-bold overflow-hidden">
                                ${avatarContent}
                            </div>
                            <span class="text-sm font-semibold text-slate-700">${emp.name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-3">
                        ${emp.status ? 
                            `<span class="status-badge ${config.bg} ${config.text} py-1 px-3 rounded-lg text-[10px]">${emp.status}</span>` : 
                            `<span class="text-slate-300 italic text-xs">Waiting...</span>`
                        }
                    </td>
                    <td class="px-6 py-3 text-right">
                        <div class="flex items-center justify-end gap-1">
                            <button onclick="quickSetStatus(${emp.id}, 'Present')" class="w-8 h-8 rounded-lg flex items-center justify-center bg-green-50 text-green-600 hover:bg-green-100 transition-colors"><i class="fas fa-check text-xs"></i></button>
                            <button onclick="quickSetStatus(${emp.id}, 'Half Day')" class="w-8 h-8 rounded-lg flex items-center justify-center bg-orange-50 text-orange-600 hover:bg-orange-100 transition-colors"><i class="fas fa-adjust text-xs"></i></button>
                            <button onclick="quickSetStatus(${emp.id}, 'Absent')" class="w-8 h-8 rounded-lg flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-100 transition-colors"><i class="fas fa-times text-xs"></i></button>
                        </div>
                    </td>
                `;
                compactListBody.appendChild(row);
            });
        }

        function getStatusConfig(status) {
            switch(status) {
                case 'Present': return { border: 'border-green-500', text: 'text-green-600', bg: 'bg-green-50', icon: 'fas fa-check' };
                case 'Half Day': return { border: 'border-orange-400', text: 'text-orange-600', bg: 'bg-orange-50', icon: 'fas fa-adjust' };
                case 'Absent': return { border: 'border-red-500', text: 'text-red-600', bg: 'bg-red-50', icon: 'fas fa-times' };
                case 'Late': return { border: 'border-yellow-400', text: 'text-yellow-600', bg: 'bg-yellow-50', icon: 'fas fa-clock' };
                case 'Leave': return { border: 'border-purple-500', text: 'text-purple-600', bg: 'bg-purple-50', icon: 'fas fa-plane' };
                default: return { border: 'border-slate-100', text: 'text-slate-300', bg: 'bg-slate-50', icon: 'fas fa-minus' };
            }
        }

        function updateStats() {
            const total = employees.length;
            const counts = {
                present: employees.filter(e => e.status === 'Present' || e.status === 'Late').length,
                half: employees.filter(e => e.status === 'Half Day'|| e.status === 'Leave/Present'||e.status === 'Present/Leave').length,
                absent: employees.filter(e => e.status === 'Absent'|| e.status === 'Leave/Absent'||e.status === 'Absent/Leave').length,
                leave: employees.filter(e => e.status === 'Leave').length
            };
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = counts.present;
            document.getElementById('stat-half').innerText = counts.half;
            document.getElementById('stat-absent').innerText = counts.absent;
            document.getElementById('stat-leave').innerText = counts.leave;
            
            if(total > 0) {
                document.getElementById('bar-present').style.width = `${(counts.present / total) * 100}%`;
                document.getElementById('bar-half').style.width = `${(counts.half / total) * 100}%`;
                document.getElementById('bar-absent').style.width = `${(counts.absent / total) * 100}%`;
                document.getElementById('bar-leave').style.width = `${(counts.leave / total) * 100}%`;
            }
        }

        function markAllPresent() {
            employees.forEach(emp => {
                if (!emp.status) emp.status = 'Present';
            });
            markAllPresentFunction(currentSelectedDate);
            showToast('Everyone marked Present', 'fa-check-double');
            render();
            updateStats();
        }

        function openModal(emp) {
let actionButtons='<span class="text-center text-block">No Actions</span>';

                    const present=`<button onclick="setStatus('Present')" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-green-50 hover:bg-green-100 text-green-700 text-xs font-bold transition-all active:scale-95">
                        <div class="w-8 h-8 rounded-xl bg-white flex items-center justify-center text-green-600 shadow-sm"><i class="fas fa-check"></i></div>
                        <span>Present</span>
                    </button>`;
                     const halfday=`                     <button onclick="setStatus('Half Day')" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-orange-50 hover:bg-orange-100 text-orange-700 text-xs font-bold transition-all active:scale-95">
                        <div class="w-8 h-8 rounded-xl bg-white flex items-center justify-center text-orange-600 shadow-sm"><i class="fas fa-adjust"></i></div>
                        <span>Half Day</span>
                    </button>`;
                    
                 const absent=`<button onclick="setStatus('Absent')" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold transition-all active:scale-95">
                        <div class="w-8 h-8 rounded-xl bg-white flex items-center justify-center text-red-600 shadow-sm"><i class="fas fa-times"></i></div>
                        <span>Absent</span>
                    </button>`;
   if(emp.status===null){
    actionButtons+=present;
     actionButtons+=absent;
      actionButtons+=halfday;
   }
   else if(emp.status==='Half Day'){
     actionButtons+=absent;
      actionButtons+=halfday;
   }

            currentEditingEmpId = emp.id;
            const modalAvatar = document.getElementById('modalEmpAvatar');
            
            if(emp.image) {
                modalAvatar.innerHTML = `<img src="${emp.image}" class="avatar-img">`;
                modalAvatar.className = "w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-white text-xl font-black mb-3 shadow-lg transform -rotate-3 overflow-hidden";
            } else {
                modalAvatar.innerText = emp.initials;
                modalAvatar.className = "w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-white text-xl font-black mb-3 shadow-lg transform -rotate-3 bg-blue-600";
            }
            document.getElementById('actionbuttons').innerHTML=actionButtons;
            document.getElementById('modalEmpName').innerText = emp.name;
            document.getElementById('modalEmpID').innerText = `ID: ${emp.id}`;
            modal.classList.remove('hidden-modal');
        }

        function closeModal() {
            modal.classList.add('hidden-modal');
            currentEditingEmpId = null;
        }

        function setStatus(status) {
            saveStatusToServer(currentEditingEmpId, status);
            closeModal();
        }

        function quickSetStatus(id, status) {
            saveStatusToServer(id, status);
        }

        function saveStatusToServer(eid, status) {
const csrfToken=document.querySelector("meta[name='_csrf']").getAttribute("content");
            $.ajax({
                url: '/admin/updateAttendance',
                type: 'POST',
                    headers: { 'X-CSRF-TOKEN': csrfToken },
                data: {
                    eid: eid,   
                    status: status,
                    date: currentSelectedDate
                },
                success: (res) => {
                    const emp = employees.find(e => e.id === eid);
                    if(emp) emp.status = status;
                    showToast(`${status} Saved`);
                    render();
                    updateStats();
                },
                error: (err) => showToast("Update Failed", "fa-circle-xmark")
            });
        }

        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.querySelector('i').className = `fas ${icon} ${icon === 'fa-circle-check' ? 'text-green-400' : 'text-red-400'}`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }
        function markAllPresentFunction(date){
            const csrfToken=document.querySelector("meta[name='_csrf']").getAttribute("content");
            $.ajax({
                url:'/admin/markAllPresent',
                type:'POST',
                headers: { 'X-CSRF-TOKEN': csrfToken },
                data:{date:date},
                success:(res)=>{
                    fetchAttendenceRecords(currentSelectedDate);
                    showToast("All marked Present", "fa-check-double");
                },
                error:(err)=>{
                    console.error("Failed to mark all present:", err);
                    showToast("Failed to update", "fa-triangle-exclamation");
                }
            })
        }

        window.onclick = (e) => { if (e.target == modal) closeModal(); }
    </script>
</body>
</html>
