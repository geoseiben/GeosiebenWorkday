<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title>Separation Management | Admin Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'sans-serif']
                    },
                    keyframes: {
                        rowIn: { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        shimmer: { '0%': { backgroundPosition: '100% 50%' }, '100%': { backgroundPosition: '0 50%' } },
                        bump: { '0%': { transform: 'scale(1)' }, '40%': { transform: 'scale(1.25)' }, '100%': { transform: 'scale(1)' } }
                    },
                    animation: {
                        rowIn: 'rowIn 0.35s ease forwards',
                        shimmer: 'shimmer 1.4s ease infinite',
                        bump: 'bump 0.3s ease'
                    }
                }
            }
        }
    </script>

    <!--
        Reusable component classes (status pills, icon buttons, avatar, skeleton
        bar, the DataTables search/pagination controls DataTables itself
        generates with fixed class names) are defined here with @apply so the
        JS below can keep referencing them by name while every declaration is
        still pure Tailwind utilities underneath.
    -->
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-slate-50 text-slate-900 font-sans; }
            h2 { @apply font-display; }
        }
        @layer components {
            .glass-card { @apply bg-white border border-slate-200 shadow-sm rounded-xl; }

            .status-pill { @apply inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold uppercase border transition-transform duration-150 hover:scale-[1.04]; }
            .status-pill i { @apply text-[10px]; }
            .pill-pending   { @apply bg-orange-50 text-orange-800 border-orange-100; }
            .pill-approved  { @apply bg-emerald-50 text-emerald-800 border-emerald-100; }
            .pill-rejected  { @apply bg-red-50 text-red-800 border-red-100; }
            .pill-completed { @apply bg-indigo-50 text-indigo-800 border-indigo-100; }
            .pill-withdrawn { @apply bg-slate-100 text-slate-600 border-slate-200; }

            .remarks-input { @apply text-[13px] rounded-md border border-slate-300 px-2 py-1.5 w-full transition-shadow duration-150 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 disabled:bg-slate-100 disabled:cursor-not-allowed; }

            .btn-icon { @apply w-8 h-8 inline-flex items-center justify-center rounded-md border-0 text-[13px] transition-transform duration-150 active:scale-90 hover:-translate-y-0.5; }
            .btn-approve  { @apply bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white; }
            .btn-reject   { @apply bg-red-50 text-red-600 hover:bg-red-600 hover:text-white; }
            .btn-withdraw { @apply bg-orange-50 text-orange-600 hover:bg-orange-600 hover:text-white; }
            .btn-complete { @apply bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white; }
            .btn-view     { @apply bg-violet-50 text-indigo-500 hover:bg-indigo-500 hover:text-white; }

            .emp-avatar { @apply w-9 h-9 rounded-full object-cover border-2 border-white ring-1 ring-slate-200 transition-transform duration-200 flex-shrink-0; }
            .emp-cell { @apply flex items-center gap-2.5; }
            tr:hover .emp-avatar { @apply scale-[1.08] ring-indigo-500; }

            .skeleton-bar { @apply h-3 rounded bg-gradient-to-r from-slate-100 via-slate-50 to-slate-100 bg-[length:400%_100%] animate-shimmer; }

            /* DataTables generates these elements/classnames itself at runtime */
            .dataTables_wrapper .dataTables_filter input {
                @apply text-[13px] rounded-md border border-slate-300 px-3 py-1.5 ml-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15;
            }
            .dataTables_wrapper .dataTables_filter label { @apply text-[13px] text-slate-500 font-medium; }
            .dataTables_wrapper .dataTables_length select {
                @apply text-[13px] rounded-md border border-slate-300 px-2 py-1 mx-1 focus:outline-none focus:border-indigo-500;
            }
            .dataTables_wrapper .dataTables_length label { @apply text-[13px] text-slate-500 font-medium; }
            .dataTables_wrapper .dataTables_info { @apply text-[13px] text-slate-500; }
            .dataTables_wrapper .dataTables_paginate { @apply flex items-center gap-1; }
            .dataTables_wrapper .dataTables_paginate .paginate_button {
                @apply text-[13px] px-2.5 py-1 rounded-md border border-transparent text-slate-600 cursor-pointer;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                @apply bg-indigo-500 text-white border-indigo-500;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button.disabled {
                @apply text-slate-300 cursor-not-allowed;
            }
            .dataTables_wrapper .dataTables_paginate .paginate_button:hover:not(.disabled):not(.current) {
                @apply bg-slate-100;
            }
        }
    </style>
</head>
<head th:replace="includes/header :: header"></head>
<body>
<div class="max-w-full px-4 py-6">
    <div class="glass-card overflow-hidden">
        <div class="p-4 border-b border-slate-200 bg-white flex justify-between items-center">
            <h2 class="font-bold text-slate-800 m-0 text-xl">
                Separation Requests
                <span id="queueCount" class="inline-flex items-center justify-center min-w-[1.75rem] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-sm font-semibold ml-2 transition-transform duration-200">0</span>
            </h2>
        </div>

        <div class="overflow-x-auto">
            <table id="enhancedDataTable" class="w-full align-middle border-collapse">
                <thead>
                    <tr>
                        <th class="w-[50px] bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">#</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">Employee</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">Type/Reason</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">Resigned</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">LWD</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">Status</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-left">Admin Remarks</th>
                        <th class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide px-3 py-3 border-b-2 border-slate-200 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="skeleton-row"><td colspan="8" class="px-3 py-3.5"><div class="skeleton-bar"></div></td></tr>
                    <tr class="skeleton-row"><td colspan="8" class="px-3 py-3.5"><div class="skeleton-bar"></div></td></tr>
                    <tr class="skeleton-row"><td colspan="8" class="px-3 py-3.5"><div class="skeleton-bar"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/messenger :: chat-widget}"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

<script>
    // Status map: 0 Pending, 1 Approved, 2 Rejected, 3 Completed, 4 Withdrawn
    const STATUS = {
        PENDING: 0,
        APPROVED: 1,
        REJECTED: 2,
        COMPLETED: 3,
        WITHDRAWN: 4
    };

    $(document).ready(function() {
        fetchData();
    });

    function fetchData() {
        $.ajax({
            url: '/admin/separtion/getRequests',
            type: 'GET',
            success: function(res) {
                renderTable(res);
                const count = res ? res.length : 0;
                $('#queueCount').text(count).addClass('animate-bump');
                setTimeout(() => $('#queueCount').removeClass('animate-bump'), 300);
            }
        });
    }

    function formatDate(dateStr) {
        if (!dateStr) return 'N/A';
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function initials(first, last) {
        return `${(first || '?').charAt(0)}${(last || '').charAt(0)}`.toUpperCase();
    }

    function avatarUrl(item) {
        if (item.profileImage) return item.profileImage;
        const name = encodeURIComponent(`${item.firstName || ''} ${item.lastName || ''}`.trim() || 'NA');
        return `https://ui-avatars.com/api/?name=${name}&background=6366f1&color=fff&bold=true&size=64`;
    }

    function statusMeta(status) {
        switch (status) {
            case STATUS.PENDING:   return { pill: 'pill-pending',   icon: 'fa-hourglass-half', label: 'Pending' };
            case STATUS.APPROVED:  return { pill: 'pill-approved',  icon: 'fa-check',          label: 'Approved' };
            case STATUS.REJECTED:  return { pill: 'pill-rejected',  icon: 'fa-xmark',          label: 'Rejected' };
            case STATUS.COMPLETED: return { pill: 'pill-completed', icon: 'fa-flag-checkered', label: 'Completed' };
            case STATUS.WITHDRAWN: return { pill: 'pill-withdrawn', icon: 'fa-rotate-left',    label: 'Withdrawn' };
            default:                return { pill: 'pill-pending',   icon: 'fa-circle-question', label: 'Unknown' };
        }
    }

    function buildActionButtons(item, status) {
        let buttons = `
            <a href="/admin/separation/view?separationid=${encodeURIComponent(item.separationid)}" class="btn-icon btn-view" title="View Details">
                <i class="fas fa-eye"></i>
            </a>`;

        if (status === STATUS.PENDING) {
            buttons += `
                <button onclick="handleUpdate('approve', ${item.separationid})" class="btn-icon btn-approve" title="Approve">
                    <i class="fas fa-check"></i>
                </button>
                <button onclick="handleUpdate('reject', ${item.separationid})" class="btn-icon btn-reject" title="Reject">
                    <i class="fas fa-times"></i>
                </button>`;
        } else if (status === STATUS.APPROVED) {
            buttons += `
                <button onclick="handleUpdate('complete', ${item.separationid})" class="btn-icon btn-complete" title="Mark Completed">
                    <i class="fas fa-flag-checkered"></i>
                </button>
                <button onclick="handleUpdate('withdraw', ${item.separationid})" class="btn-icon btn-withdraw" title="Withdraw Approval">
                    <i class="fas fa-rotate-left"></i>
                </button>`;
        }
        // Rejected, Completed, Withdrawn: view only (terminal states)

        return buttons;
    }

    function renderTable(data) {
        if ($.fn.DataTable.isDataTable('#enhancedDataTable')) {
            $('#enhancedDataTable').DataTable().destroy();
        }

        const $tbody = $('#tableBody');
        $tbody.empty();

        data.forEach((item, index) => {
            console.log(item);
            const status = parseInt(item.status);
            const meta = statusMeta(status);
            const statusPill = `<span class="status-pill ${meta.pill}"><i class="fas ${meta.icon}"></i>${meta.label}</span>`;
            const actionButtons = buildActionButtons(item, status);
            const isEditable = status === STATUS.PENDING;

            const $row = $(`
                <tr data-id="${item.separationid}" class="opacity-0 animate-rowIn hover:bg-slate-50 transition-colors" style="animation-delay: ${Math.min(index * 30, 300)}ms">
                    <td class="px-3 py-2.5 border-t border-slate-100 text-slate-400 font-medium">${index + 1}</td>
                    <td class="px-3 py-2.5 border-t border-slate-100">
                        <div class="emp-cell">
                            <img class="emp-avatar" src="${item.image?'../'+item.image:avatarUrl(item)}" alt="${initials(item.firstName, item.lastName)}"
                                 onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(initials(item.firstName, item.lastName))}&background=94a3b8&color=fff';">
                            <div>
                                <div class="font-semibold text-slate-700">${item.firstName} ${item.lastName}</div>
                                <div class="text-xs text-slate-400">ID: ${item.eid}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-3 py-2.5 border-t border-slate-100">
                        <div class="font-medium text-slate-600 text-[13px]">${item.separationType}</div>
                        <div class="truncate text-slate-400 text-xs max-w-[150px]">${item.reasonforLeaving}</div>
                    </td>
                    <td class="px-3 py-2.5 border-t border-slate-100 text-[13px]">${formatDate(item.resignationDate)}</td>
                    <td class="px-3 py-2.5 border-t border-slate-100 font-bold text-indigo-600 text-[13px]">${formatDate(item.lastWorkingDay)}</td>
                    <td class="px-3 py-2.5 border-t border-slate-100">${statusPill}</td>
                    <td class="px-3 py-2.5 border-t border-slate-100">
                        <input type="text" id="remarks-${item.separationid}"
                               class="remarks-input"
                               placeholder="Admin notes..."
                               value="${item.adminRemarks || ''}"
                               ${!isEditable ? 'disabled' : ''}>
                    </td>
                    <td class="px-3 py-2.5 border-t border-slate-100 text-center">
                        <div class="flex justify-center gap-2">
                            ${actionButtons}
                        </div>
                    </td>
                </tr>
            `);

            $tbody.append($row);
        });

        $('#enhancedDataTable').DataTable({
            pageLength: 10,
            dom: '<"p-3 flex justify-between items-center"f>rt<"p-3 flex justify-between items-center"ip>',
            language: { search: "", searchPlaceholder: "Search requests..." }
        });
    }

    async function handleUpdate(action, id) {
        const remarks = $(`#remarks-${id}`).val();

        if (action === 'reject' && (!remarks || !remarks.trim())) {
            return Swal.fire('Note Required', 'Please provide a reason for rejection.', 'warning');
        }

        const actionCopy = {
            approve: 'approve',
            reject: 'reject',
            withdraw: 'withdraw approval for',
            complete: 'mark as completed'
        }[action] || action;

        const confirm = await Swal.fire({
            title: `Are you sure?`,
            text: `You are about to ${actionCopy} this request.`,
            icon: action === 'withdraw' ? 'warning' : 'question',
            showCancelButton: true,
            confirmButtonColor: action === 'approve' ? '#059669'
                : action === 'withdraw' ? '#ea580c'
                : action === 'complete' ? '#4f46e5'
                : '#dc2626'
        });

        if (!confirm.isConfirmed) return;

        const $row = $(`tr[data-id="${id}"]`);
        $row.css({ transition: 'opacity 0.2s ease', opacity: 0.5 });

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        try {
            const response = await fetch('/admin/separtion/updateStatus', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({ action, id, remarks: remarks || '' })
            });

            const res = await response.json();
            if (res.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Updated!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
                fetchData();
            } else {
                $row.css('opacity', 1);
            }
        } catch (e) {
            $row.css('opacity', 1);
            Swal.fire('Error', 'Something went wrong', 'error');
        }
    }
</script>
</body>
</html>
