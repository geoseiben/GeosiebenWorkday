<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bench &mdash; Resource Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F6F7FA;
    --panel: #FFFFFF;
    --panel-2: #F1F3F7;
    --line: #E4E7EE;
    --text: #1B1E27;
    --muted: #6B7182;
    --muted-2: #9AA0B0;
    --accent: #0EA894;
    --accent-dim: rgba(14,168,148,0.10);
    --amber: #B9791A;
    --amber-dim: rgba(185,121,26,0.10);
    --coral: #D6483C;
    --coral-dim: rgba(214,72,60,0.10);
    --violet: #6366F1;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,24,34,0.04), 0 8px 20px rgba(20,24,34,0.05);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(99,102,241,0.06), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(14,168,148,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .disp{font-family:'Space Grotesk', sans-serif;}

  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes shimmer{ 0%{background-position:-200px 0;} 100%{background-position:200px 0;} }
  @keyframes popIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- Top bar ---- */
  .topbar{
    padding:28px clamp(16px,4vw,48px) 18px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--violet));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:16px;
    flex-shrink:0;
    transition:transform .35s var(--ease);
  }
  .brand:hover .mark{ transform:rotate(-8deg) scale(1.06); }
  .brand h1{font-family:'Space Grotesk';font-weight:600;font-size:20px;margin:0;letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
  .live{
    display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;
    font-family:'JetBrains Mono';padding:6px 12px;border:1px solid var(--line);border-radius:100px;
    background:var(--panel); box-shadow:var(--shadow);
    transition:border-color .2s ease;
  }
  .live.is-error{ color:var(--coral); border-color:rgba(214,72,60,0.3); }
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);animation:pulse 2s infinite;}
  .live.is-error .dot{ background:var(--coral); box-shadow:0 0 0 4px var(--coral-dim); }

  /* ---- Analytics strip ---- */
  .analytics{
    padding:22px clamp(16px,4vw,48px) 6px;
    display:grid;
    grid-template-columns: repeat(4, minmax(180px,1fr)) 1.3fr;
    gap:14px;
  }
  @media (max-width:1100px){ .analytics{grid-template-columns: repeat(2,1fr);} }
  .kpi, .chart-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow:var(--shadow);
    animation:fadeInUp .45s var(--ease) both;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .kpi:hover{ transform:translateY(-2px); box-shadow:0 4px 8px rgba(20,24,34,0.05), 0 14px 26px rgba(20,24,34,0.07); }
  .kpi .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;}
  .kpi .value{font-family:'Space Grotesk';font-size:30px;font-weight:600;margin-top:8px;letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:12px;color:var(--muted-2);margin-top:4px;}
  .kpi .sub.up{color:var(--accent);}
  .kpi .sub.warn{color:var(--amber);}
  .chart-card{grid-row: span 1;}
  .chart-card .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:10px;display:block;}
  .chart-wrap{height:110px; position:relative;}

  /* ---- Skeletons ---- */
  .sk{
    background:linear-gradient(90deg, var(--panel-2) 25%, #E9ECF1 37%, var(--panel-2) 63%);
    background-size:400px 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    border-radius:6px;
  }
  .kpi.skeleton .value{height:28px; width:60%; margin-top:10px;}
  .kpi.skeleton .label{height:11px; width:70%; border-radius:4px;}
  .tile.skeleton{ }
  .tile.skeleton .sk-avatar{width:64px;height:64px;border-radius:50%;}
  .tile.skeleton .sk-line{height:10px; margin-top:8px; border-radius:4px;}

  /* ---- Controls ---- */
  .controls{
    padding:10px clamp(16px,4vw,48px) 8px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--muted-2); pointer-events:none;
    transition:color .2s ease;
  }
  .search-wrap:focus-within svg{ color:var(--accent); }
  .search{
    width:100%;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 34px 10px 34px; color:var(--text); font-size:13.5px; font-family:'Inter';
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .search::placeholder{color:var(--muted-2);}
  .search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%) scale(0.7);
    width:20px; height:20px; border-radius:50%; border:none; background:var(--panel-2);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:all .18s var(--ease); font-size:13px; line-height:1;
  }
  .search-clear.show{ opacity:1; pointer-events:auto; transform:translateY(-50%) scale(1); }
  .search-clear:hover{ background:var(--coral-dim); color:var(--coral); }

  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .chip-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; border-radius:100px; font-size:12.5px; cursor:pointer; font-weight:500;
    transition:transform .15s var(--ease), background .15s ease, border-color .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .chip-btn:hover{color:var(--text); border-color:var(--muted-2); transform:translateY(-1px);}
  .chip-btn:active{ transform:translateY(0) scale(.96); }
  .chip-btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  select.sortsel{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:10px; font-size:12.5px; font-family:'Inter'; cursor:pointer;
    transition:border-color .2s ease;
  }
  select.sortsel:focus{ outline:none; border-color:var(--accent); }

  /* Status filter chips reuse .chip-btn but get a small coloured dot */
  .status-filters{display:flex; gap:8px; flex-wrap:wrap;}
  .status-filters .chip-btn{display:flex; align-items:center; gap:6px;}
  .status-filters .chip-btn .swatch{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--muted-2);}
  .status-filters .chip-btn[data-status="Available"] .swatch{background:var(--accent);}
  .status-filters .chip-btn[data-status="Allocated"] .swatch{background:var(--amber);}
  .status-filters .chip-btn[data-status="On Leave"] .swatch{background:var(--coral);}

  /* View toggle (comfortable / compact) */
  .view-toggle{
    display:flex; align-items:center; gap:2px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:3px; flex-shrink:0;
  }
  .view-toggle button{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:28px; border:none; background:transparent; border-radius:7px;
    color:var(--muted); cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .view-toggle button svg{width:15px; height:15px;}
  .view-toggle button:hover{color:var(--text);}
  .view-toggle button.active{background:var(--panel); color:var(--accent); box-shadow:var(--shadow);}

  /* ---- Grid of tiles ---- */
  .grid{
    padding:16px clamp(16px,4vw,48px) 48px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap:16px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    position:relative;
    box-shadow:0 1px 2px rgba(20,24,34,0.03);
    transition: transform .25s var(--ease), border-color .2s ease, box-shadow .25s var(--ease), padding .2s ease;
  }

  /* ---- Compact view ---- */
  .grid.compact{
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap:10px;
  }
  .grid.compact .tile{ padding:12px 14px; }
  .grid.compact .tile:hover{ transform:translateY(-2px); }
  .grid.compact .status-badge{ top:10px; right:10px; padding:3px 7px; font-size:9.5px; }
  .grid.compact .status-badge .status-label{ display:none; }
  .grid.compact .tile-head{ gap:10px; }
  .grid.compact .ring{ width:40px; height:40px; }
  .grid.compact .ring svg{ width:40px; height:40px; }
  .grid.compact .ring .track,
  .grid.compact .ring .prog{ stroke-width:5; }
  .grid.compact .ring img{ width:32px; height:32px; top:4px; left:4px; }
  .grid.compact .ring .pct{ font-size:8.5px; padding:1px 4px; bottom:-4px; right:-6px; }
  .grid.compact .who h3{ font-size:13px; }
  .grid.compact .who .role{ font-size:11px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grid.compact .who .dept{ display:none; }
  .grid.compact .skills,
  .grid.compact .projects{ display:none; }
  .grid.compact .tile-foot{ margin-top:10px; padding-top:10px; }
  .grid.compact .util,
  .grid.compact .loc{ font-size:11px; }

  /* ---- List view (single-column scannable rows) ---- */
  .grid.list{
    display:flex; flex-direction:column; gap:8px;
  }
  .grid.list .tile{
    display:flex; align-items:center; gap:18px;
    padding:9px 16px; border-radius:10px;
  }
  .grid.list .tile:hover{ transform:translateX(2px); }
  .grid.list .status-badge{
    position:static; order:1; flex:0 0 92px; justify-content:center;
  }
  .grid.list .tile-head{
    order:2; flex:1 1 220px; min-width:0; gap:10px;
  }
  .grid.list .ring{ width:34px; height:34px; }
  .grid.list .ring svg{ width:34px; height:34px; }
  .grid.list .ring .track,
  .grid.list .ring .prog{ stroke-width:5; }
  .grid.list .ring img{ width:26px; height:26px; top:4px; left:4px; }
  .grid.list .ring .pct{ font-size:8.5px; padding:1px 4px; bottom:-4px; right:-6px; }
  .grid.list .who h3{ font-size:13px; }
  .grid.list .who .role{
    font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .grid.list .who .dept{ margin-top:4px; }

  .grid.list .skills{
    order:3; flex:1 1 200px; min-width:0; margin-top:0;
    display:flex; flex-direction:row; flex-wrap:nowrap; gap:6px;
    overflow-x:auto; scrollbar-width:none; padding-bottom:1px;
  }
  .grid.list .skills::-webkit-scrollbar{ display:none; }
  .grid.list .skill-row{
    flex-shrink:0; gap:5px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:100px;
    padding:3px 9px 3px 4px;
  }
  .grid.list .skill-name{ font-size:10.5px; width:auto; max-width:84px; }
  .grid.list .skill-bar{ display:none; }
  .grid.list .skill-pct{ font-size:10px; width:auto; color:var(--muted); }

  .grid.list .projects{
    order:4; flex:1 1 180px; min-width:0; margin-top:0;
  }
  .grid.list .projects-label{ display:none; }
  .grid.list .project-list{
    flex-direction:row; flex-wrap:nowrap; gap:6px;
    overflow-x:auto; scrollbar-width:none;
  }
  .grid.list .project-list::-webkit-scrollbar{ display:none; }
  .grid.list .project-chip{
    flex-shrink:0; padding:3px 9px; font-size:10.5px; max-width:160px;
  }
  .grid.list .project-chip .proj-name{ overflow:hidden; text-overflow:ellipsis; }
  .grid.list .project-chip .proj-role{ display:none; }
  .grid.list .projects .none{ font-size:11px; white-space:nowrap; }

  .grid.list .tile-foot{
    order:5; margin:0; padding:0; border-top:none;
    flex:0 0 auto; display:flex; gap:22px; justify-content:flex-start;
  }
  .grid.list .util,
  .grid.list .loc{ font-size:12px; white-space:nowrap; }
  @media (max-width:900px){
    .grid.list .tile{ flex-wrap:wrap; row-gap:8px; }
    .grid.list .skills,
    .grid.list .projects{ flex-basis:100%; order:10; margin-left:110px; }
    .grid.list .tile-foot{ flex-basis:100%; margin-left:110px; order:11; }
  }
  /* Entrance animation is applied only once, only to brand-new tiles.
     Existing tiles that get patched or reordered never get this class,
     so a data refresh can never replay the fade-in (the flicker cause). */
  .tile.tile-enter{
    animation:fadeInUp .45s var(--ease) both;
  }
  .tile:hover{ transform:translateY(-4px); border-color:#C7CCD8; box-shadow:var(--shadow); }
  .tile-head{display:flex; gap:14px; align-items:center;}

  .ring{
    position:relative; width:64px; height:64px; flex-shrink:0;
  }
  .ring svg{transform:rotate(-90deg);}
  .ring .track{fill:none; stroke:var(--line); stroke-width:4;}
  .ring .prog{fill:none; stroke-width:4; stroke-linecap:round; transition: stroke-dasharray 1s var(--ease), stroke .4s ease;}
  .ring img{
    position:absolute; top:5px; left:5px; width:54px; height:54px; border-radius:50%;
    object-fit:cover; border:2px solid var(--panel);
    box-shadow:0 0 0 1px var(--line);
    transition:transform .25s var(--ease);
  }
  .tile:hover .ring img{ transform:scale(1.05); }
  .ring .pct{
    position:absolute; bottom:-6px; right:-4px;
    background:var(--panel); border:1px solid var(--line); border-radius:100px;
    font-family:'JetBrains Mono'; font-size:10px; font-weight:600; padding:2px 5px;
    box-shadow:var(--shadow);
  }

  .who h3{margin:0; font-family:'Space Grotesk'; font-size:15.5px; font-weight:600;}
  .who .role{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .who .dept{
    display:inline-block; margin-top:6px; font-size:10.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.05em; color:var(--muted-2);
    border:1px solid var(--line); border-radius:100px; padding:2px 8px;
  }

  .status-badge{
    position:absolute; top:16px; right:16px;
    font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:100px;
    display:flex; align-items:center; gap:5px;
    transition:background-color .3s ease, color .3s ease;
  }
  .status-badge .dot{width:6px;height:6px;border-radius:50%;}
  .status-available{background:var(--accent-dim); color:var(--accent);}
  .status-available .dot{background:var(--accent); animation:pulse 2s infinite;}
  .status-allocated{background:var(--amber-dim); color:var(--amber);}
  .status-allocated .dot{background:var(--amber);}
  .status-leave{background:var(--coral-dim); color:var(--coral);}
  .status-leave .dot{background:var(--coral);}

  .skills{margin-top:16px; display:flex; flex-direction:column; gap:9px;}
  .skill-row{display:flex; align-items:center; gap:10px;}
  .skill-name{font-size:12px; color:var(--muted); width:92px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .skill-bar{flex:1; height:5px; background:var(--line); border-radius:100px; overflow:hidden;}
  .skill-fill{height:100%; border-radius:100px; width:0; transition:width 1s var(--ease), background-color .4s ease;}
  .skill-pct{font-family:'JetBrains Mono'; font-size:11px; color:var(--muted-2); width:32px; text-align:right; flex-shrink:0;}

  .projects{margin-top:14px;}
  .projects .projects-label{
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted-2); margin-bottom:8px; display:block;
  }
  .project-list{display:flex; flex-direction:column; gap:6px;}
  .project-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; font-size:12px;
  }
  .project-chip .proj-dot{width:6px;height:6px;border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse 2s infinite;}
  .project-chip .proj-name{flex:1; color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .project-chip .proj-role{color:var(--muted-2); font-size:11px; flex-shrink:0;}
  .projects .none{font-size:12px; color:var(--muted-2); font-style:italic;}

  .tile-foot{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .util{font-size:11.5px; color:var(--muted-2);}
  .util b{color:var(--text); font-family:'JetBrains Mono'; font-weight:600;}
  .loc{font-size:11.5px; color:var(--muted-2); display:flex; align-items:center; gap:5px;}

  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted);
    font-size:14px; animation:fadeIn .4s ease;
  }
  .empty .icon{ font-size:28px; display:block; margin-bottom:10px; opacity:.6; }

  /* ---- Toast ---- */
  .toast{
    position:fixed; bottom:22px; right:22px; z-index:50;
    background:var(--panel); border:1px solid var(--coral); color:var(--coral);
    padding:12px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:10px; animation:toastIn .3s var(--ease);
    max-width:320px;
  }
  .toast .spinner-dot{ width:8px;height:8px;border-radius:50%; background:var(--coral); flex-shrink:0; }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:100px;}
</style>
<head th:replace="includes/header :: header"></head>

</head>

<body>
  <div class="topbar">
    <div class="brand">
      <div class="mark">G7</div>
      <div>
        <h1>Resource Manager</h1>
      </div>
    </div>
  </div>

  <div class="analytics" id="analytics"></div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search" id="searchInput" type="text" placeholder="Search by name, designation, skill or project…">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">✕</button>
    </div>
    <div class="filters" id="deptFilters"></div>
    <div class="status-filters" id="statusFilters"></div>
    <select class="sortsel" id="sortSelect">
      <option value="name">Sort: Name (A&ndash;Z)</option>
      <option value="proficiency">Sort: Proficiency (high&ndash;low)</option>
      <option value="utilization">Sort: Utilization (high&ndash;low)</option>
    </select>
    <div class="view-toggle" id="viewToggle">
      <button type="button" data-view="comfortable" title="Comfortable view" aria-label="Comfortable view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button type="button" data-view="compact" title="Compact view" aria-label="Compact view">

<script>
/* -------------------- STATE -------------------- */

/* -------------------- FALLBACK MOCK DATA -------------------- */
/* Used only if the API request fails, so the UI still has something to show. */
const MOCK_EMPLOYEES = [

/* -------------------- HELPERS -------------------- */
function avgSkill(e){
  if(!e.skills || !e.skills.length) return 0;
  return Math.round(e.skills.reduce((a,s)=>a+Number(s.scale||0),0)/e.skills.length);
}
function colorForPct(p){
  const css = getComputedStyle(document.documentElement);
  return p>=85 ? css.getPropertyValue('--accent') : p>=70 ? css.getPropertyValue('--amber') : css.getPropertyValue('--coral');
}
function statusClass(s){
  if(s==="Available") return "status-available";
  if(s==="On Leave") return "status-leave";
  return "status-allocated";
}
function statusLabel(s){ return s || "Allocated"; }
function fullName(e){ return [e.firstName, e.lastName].filter(Boolean).join(" "); }
function utilOf(e){ return (e.util ?? e.utilization ?? Math.max(20, avgSkill(e)-15)); }
function locOf(e){ return e.location || e.loc || "Unassigned"; }
function keyOf(e){ return String(e.EID ?? e.id ?? (fullName(e)+'|'+(e.designation||''))); }
function projectsOf(e){ return e.projects || e.projectList || []; }
/* Different API responses have used different casings for the project
   name field (projectName / projectName / name / title). Read them all
   in one place so display and search never fall out of sync again. */
function projectNameOf(p){ return p.projectName || p.projectName || p.name || p.title || ""; }
function projectRoleOf(p){ return p.role || p.allocation || ""; }
/* A project counts as "active" if it carries a status field saying so,
   or if it has no status field at all (assume anything listed is current). */
function isActiveProject(p){
  if(p.status === undefined || p.status === null || p.status === "") return true;
  return String(p.status).toLowerCase().includes("active") || String(p.status).toLowerCase().includes("progress");
}
function activeProjects(e){ return projectsOf(e).filter(isActiveProject); }
function debounce(fn, wait){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), wait); }; }

/* Animate a number from whatever is currently shown to a new target,
   so periodic refreshes count up/down smoothly instead of jumping. */
function animateCount(el, target, suffix=""){
  const current = parseInt(el.textContent, 10);
  const start = Number.isFinite(current) ? current : 0;
  if(start === target){ el.textContent = target + suffix; return; }
  const duration = 700;
  const startTime = performance.now();
  function step(now){
    const p = Math.min((now-startTime)/duration, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(start + (target-start)*eased) + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* -------------------- DATA FETCH -------------------- */


function getEmployeeData(){
  if(!hasLoadedOnce){
    renderSkeleton();

  $.ajax({

      renderAnalytics();

      hasLoadedOnce = true;
      renderAnalytics();

      renderStatusFilters();

} 

function showToast(msg){
  if(toastVisible) return;
  toastVisible = true;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="spinner-dot"></span><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>{

    setTimeout(()=>{ t.remove(); toastVisible = false; }, 300);
  }, 4200);
}

/* -------------------- SKELETON STATE (first load only) -------------------- */

/* -------------------- TILE BUILD / UPDATE -------------------- */
function buildSkillRowHTML(s){
  return `
    <div class="skill-row" data-skill="${s.skill}">
      <div class="skill-name">${s.skill}</div>
      <div class="skill-bar"><div class="skill-fill" data-target="${s.scale}" style="background:${colorForPct(s.scale)};"></div></div>
      <div class="skill-pct mono">${s.scale}%</div>
    </div>`;
}

function buildProjectChipHTML(p){
  const name = projectNameOf(p) || "Untitled project";
  const role = projectRoleOf(p);
  return `
    <div class="project-chip" data-project="${name}">
      <span class="proj-dot"></span>
      <span class="proj-name">${name}</span>
      ${role ? `<span class="proj-role">${role}</span>` : ""}
    </div>`;
}
function buildProjectsSectionHTML(e){
  const active = activeProjects(e);
  if(!active.length) return `<span class="projects-label">Active Projects</span><div class="none">No active projects — fully benched</div>`;
  return `<span class="projects-label">Active Projects (${active.length})</span><div class="project-list">${active.map(buildProjectChipHTML).join("")}</div>`;
}

function buildTileElement(e, i){
console.log(e);
  const avg = avgSkill(e);
  const circumference = 2*Math.PI*28;
  const ringColor = colorForPct(avg);
  const skillsHtml = (e.skills||[]).map(buildSkillRowHTML).join("");

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="tile tile-enter" data-key="${keyOf(e)}" style="animation-delay:${Math.min(i*45,450)}ms">
      <span class="status-badge ${statusClass(e.status)}"><span class="dot"></span><span class="status-label">${statusLabel(e.status)}</span></span>
      <div class="tile-head">
        <div class="ring">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle class="track" cx="32" cy="32" r="28"></circle>
            <circle class="prog" cx="32" cy="32" r="28" stroke="${ringColor}"
              stroke-dasharray="0 ${circumference}" data-target="${(avg/100)*circumference}" data-circ="${circumference}"></circle>
          </svg>
          <img src="../${e.image}" alt="${fullName(e)}" loading="lazy">
          <span class="pct">${avg}%</span>
        </div>
        <div class="who">
          <h3>${fullName(e)}</h3>
          <div class="role">${e.designation||""}</div>
          <span class="dept">${e.departmentShortName||"—"}</span>
        </div>
      </div>
      <div class="skills">${skillsHtml}</div>
      <div class="projects">${buildProjectsSectionHTML(e)}</div>
      <div class="tile-foot">
        <div class="util">Utilization <b>${utilOf(e)}%</b></div>
        <div class="loc">📍 <span class="loc-text">${locOf(e)}</span></div>
      </div>
    </div>`;
  const tile = wrap.firstElementChild;

  /* Animate ring + bars in from zero only on first paint of this tile. */
  requestAnimationFrame(()=>{
    tile.querySelectorAll('.skill-fill').forEach(el=>{ el.style.width = el.dataset.target + '%'; });
    const prog = tile.querySelector('.prog');
    prog.setAttribute('stroke-dasharray', `${prog.dataset.target} ${prog.dataset.circ}`);
  });
  tile.addEventListener('animationend', ()=> tile.classList.remove('tile-enter'), { once:true });

  const projectsContainer = tile.querySelector('.projects');
  const initialActive = activeProjects(e);
  projectsContainer.dataset.projKey = initialActive.map(p=>projectNameOf(p)+'|'+projectRoleOf(p)).join(',');

  return tile;
}

function updateTileElement(tile, e){
  const avg = avgSkill(e);
  const circumference = 2*Math.PI*28;

  // Status badge
  const badge = tile.querySelector('.status-badge');
  const newBadgeClass = 'status-badge ' + statusClass(e.status);
  if(badge.className !== newBadgeClass) badge.className = newBadgeClass;
  badge.querySelector('.status-label').textContent = statusLabel(e.status);

  // Ring (transitions smoothly via CSS since we're not resetting to 0)
  const prog = tile.querySelector('.prog');
  const newDash = (avg/100)*circumference;
  prog.setAttribute('stroke', colorForPct(avg));
  prog.setAttribute('stroke-dasharray', `${newDash} ${circumference}`);
  prog.dataset.target = newDash;
  tile.querySelector('.ring .pct').textContent = avg + '%';
  const img = tile.querySelector('.ring img');
  if(img.getAttribute('src') !== e.image) img.setAttribute('src', "../"+e.image);

  // Who
  tile.querySelector('.who h3').textContent = fullName(e);
  tile.querySelector('.who .role').textContent = e.designation || "";
  tile.querySelector('.who .dept').textContent = e.departmentShortName || "—";

  // Skills — update matching rows in place, add new ones, drop stale ones
  const skillsContainer = tile.querySelector('.skills');
  const incomingSkills = e.skills || [];
  const incomingNames = new Set(incomingSkills.map(s=>s.skill));

  incomingSkills.forEach(s=>{
    const row = skillsContainer.querySelector(`.skill-row[data-skill="${CSS.escape(s.skill)}"]`);
    if(row){
      const fill = row.querySelector('.skill-fill');
      fill.style.width = s.scale + '%';
      fill.style.background = colorForPct(s.scale);
      fill.dataset.target = s.scale;
      row.querySelector('.skill-pct').textContent = s.scale + '%';
    } else {
      skillsContainer.insertAdjacentHTML('beforeend', buildSkillRowHTML(s));
      const newRow = skillsContainer.querySelector(`.skill-row[data-skill="${CSS.escape(s.skill)}"]`);
      const fill = newRow.querySelector('.skill-fill');
      requestAnimationFrame(()=>{ fill.style.width = fill.dataset.target + '%'; });
    }
  });
  skillsContainer.querySelectorAll('.skill-row').forEach(row=>{
    if(!incomingNames.has(row.dataset.skill)) row.remove();
  });

  // Active projects — only touch the DOM if the set of projects actually changed
  const projectsContainer = tile.querySelector('.projects');
  const incomingActive = activeProjects(e);
  const incomingProjKey = incomingActive.map(p=>projectNameOf(p)+'|'+projectRoleOf(p)).join(',');
  if(projectsContainer.dataset.projKey !== incomingProjKey){
    projectsContainer.innerHTML = buildProjectsSectionHTML(e);
    projectsContainer.dataset.projKey = incomingProjKey;
  }

  // Footer
  tile.querySelector('.util b').textContent = utilOf(e) + '%';
  tile.querySelector('.loc-text').textContent = locOf(e);
}

/* -------------------- RENDER TILES (keyed diff, no full rebuild) -------------------- */
function renderTiles(){
  const grid = document.getElementById('tileGrid');

  // Clear the skeleton placeholders the first time real data arrives.
  grid.querySelectorAll('.tile.skeleton').forEach(n=>n.remove());

  let list = employees.filter(e=>{
    const matchesDept = activeDept==="All" || e.departmentShortName===activeDept;
    const matchesStatus = activeStatus==="All" || statusLabel(e.status)===activeStatus;
    // Search covers ALL projects (not just active ones) so past/completed work is findable too.
    const projNames = projectsOf(e).map(projectNameOf).join(" ");
    const hay = (fullName(e)+" "+(e.designation||"")+" "+(e.skills||[]).map(s=>s.skill).join(" ")+" "+projNames).toLowerCase();
    const matchesSearch = hay.includes(searchTerm.toLowerCase());
    return matchesDept && matchesStatus && matchesSearch;
  });

  if(sortMode==="name") list.sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  if(sortMode==="proficiency") list.sort((a,b)=>avgSkill(b)-avgSkill(a));
  if(sortMode==="utilization") list.sort((a,b)=>utilOf(b)-utilOf(a));

  const emptyEl = grid.querySelector('.empty');

  if(list.length===0){
    grid.querySelectorAll('.tile[data-key]').forEach(n=>n.remove());
    if(!emptyEl){
      grid.innerHTML = `<div class="empty"><span class="icon">🔍</span>No resources match these filters.<br>Try a different search or department.</div>`;
    }
    return;
  }
  if(emptyEl) emptyEl.remove();

  const existing = new Map();
  const currentOrder = [];
  grid.querySelectorAll('.tile[data-key]').forEach(t=>{
    existing.set(t.dataset.key, t);
    currentOrder.push(t.dataset.key);
  });

  const desiredOrder = list.map(keyOf);
  // If the set/order of keys is identical to what's already on screen, this
  // is a plain data refresh — patch each tile in place and touch the DOM
  // tree itself not at all (no appendChild calls => no reflow, no flicker).
  const orderChanged =
    currentOrder.length !== desiredOrder.length ||
    currentOrder.some((k, i) => k !== desiredOrder[i]);

  const seen = new Set();
  list.forEach((e,i)=>{
    const key = keyOf(e);
    seen.add(key);
    let tile = existing.get(key);
    if(tile){
      updateTileElement(tile, e);
      if(orderChanged) grid.appendChild(tile); // only move when position truly changed
    } else {
      tile = buildTileElement(e, i);
      grid.appendChild(tile);
    }
  });

  // Remove tiles for employees no longer present in the filtered list.
  existing.forEach((tile, key)=>{
    if(!seen.has(key)) tile.remove();
  });
}

/* -------------------- FILTER CHIPS -------------------- */
function renderFilters(){
  const key = depts.join('|');
  if(key === lastDeptsKey){
    // Same set of departments — just keep the active state in sync.
    document.querySelectorAll('#deptFilters .chip-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.dept === activeDept);
    });
    return;
  }
  lastDeptsKey = key;

  const wrap = document.getElementById('deptFilters');
  wrap.innerHTML = depts.map(d=>`<button class="chip-btn ${d===activeDept?'active':''}" data-dept="${d}">${d}</button>`).join("");
  wrap.querySelectorAll('.chip-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.dept === activeDept) return;
      activeDept = btn.dataset.dept;
      renderFilters();
      renderTiles();
    });
  });
}

/* -------------------- STATUS FILTER CHIPS -------------------- */
function renderStatusFilters(){
  const wrap = document.getElementById('statusFilters');
  if(!wrap.dataset.built){
    wrap.innerHTML = STATUSES.map(s=>`<button class="chip-btn ${s===activeStatus?'active':''}" data-status="${s}">${s!=="All" ? '<span class="swatch"></span>' : ''}${s}</button>`).join("");
    wrap.dataset.built = "1";
    wrap.querySelectorAll('.chip-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.status === activeStatus) return;
        activeStatus = btn.dataset.status;
        wrap.querySelectorAll('.chip-btn').forEach(b=>b.classList.toggle('active', b.dataset.status===activeStatus));
        renderTiles();
      });
    });
  }
}

/* -------------------- VIEW TOGGLE (comfortable / compact / list) -------------------- */
function applyViewMode(){
  const grid = document.getElementById('tileGrid');
  grid.classList.toggle('compact', viewMode === 'compact');
  grid.classList.toggle('list', viewMode === 'list');
  document.querySelectorAll('#viewToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === viewMode);
  });
}
document.getElementById('viewToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  const wanted = btn.dataset.view;
  if(wanted === viewMode) return;
  viewMode = wanted;
  localStorage.setItem('benchView', viewMode);
  applyViewMode();
});
applyViewMode();

const onSearch = debounce((val)=>{
  searchTerm = val;
  renderTiles();
}, 180);

document.getElementById('searchInput').addEventListener('input', (e)=>{
  document.getElementById('searchClear').classList.toggle('show', e.target.value.length>0);
  onSearch(e.target.value);
});
document.getElementById('searchClear').addEventListener('click', ()=>{
  const input = document.getElementById('searchInput');
  input.value = "";
  input.focus();
  document.getElementById('searchClear').classList.remove('show');
  searchTerm = "";
  renderTiles();
});
document.getElementById('sortSelect').addEventListener('change', (e)=>{
  sortMode = e.target.value;
  renderTiles();
});

function renderAnalytics(){
  if(!analyticsBuilt) buildAnalyticsShell();

  const total = employees.length;
  const avgProf = total ? Math.round(employees.reduce((a,e)=>a+avgSkill(e),0)/total) : 0;
  const avgUtil = total ? Math.round(employees.reduce((a,e)=>a+utilOf(e),0)/total) : 0;
  const available = employees.filter(e=>e.status==="Available").length;
  const onLeave = employees.filter(e=>e.status==="On Leave").length;

  animateCount(document.getElementById('kpiTotal'), total);
  animateCount(document.getElementById('kpiProf'), avgProf, '%');
  animateCount(document.getElementById('kpiUtil'), avgUtil, '%');
  animateCount(document.getElementById('kpiAvail'), available);

  document.getElementById('kpiTotalSub').textContent = `across ${Math.max(depts.length-1,0)} departments`;
  document.getElementById('kpiUtilSub').textContent = avgUtil>85 ? 'nearing capacity' : 'healthy headroom';
  document.getElementById('kpiUtilSub').className = 'sub ' + (avgUtil>85 ? 'warn' : '');
  document.getElementById('kpiAvailSub').textContent = `${onLeave} on leave right now`;

  const counts = {};
  employees.forEach(e=> counts[e.departmentShortName||'—'] = (counts[e.departmentShortName||'—']||0)+1 );
  deptChart.data.labels = Object.keys(counts);
  deptChart.data.datasets[0].data = Object.values(counts);
  deptChart.update();
}

getEmployeeData();
setInterval(getEmployeeData, 5000);
</script>
