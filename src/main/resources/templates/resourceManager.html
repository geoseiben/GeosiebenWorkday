<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bench &mdash; Resource Monitoring</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <style>
        :root {
            --accent: #0ea894;
            --amber: #d97706;
            --coral: #e11d48;
            --indigo: #4338ca;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        .disp { font-family: 'Space Grotesk', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tile-enter {
            animation: fadeInUp 0.4s var(--ease) both;
        }

        .ring svg { transform: rotate(-90deg); }
        .ring .track { fill: none; stroke: #e2e8f0; stroke-width: 4; }
        .ring .prog {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray 0.9s var(--ease), stroke 0.35s ease;
        }

        .skill-fill {
            width: 0;
            transition: width 0.9s var(--ease), background-color 0.35s ease;
        }

        /* ---- View Modes: Comfortable (Default), Compact, List ---- */
        /* Compact Grid Mode */
        #tileGrid.compact {
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 0.625rem;
        }
        #tileGrid.compact .tile { padding: 0.75rem 0.875rem; }
        #tileGrid.compact .status-badge { top: 0.625rem; right: 0.625rem; padding: 0.15rem 0.45rem; }
        #tileGrid.compact .status-badge .status-label { display: none; }
        #tileGrid.compact .ring { width: 42px; height: 42px; }
        #tileGrid.compact .ring svg { width: 42px; height: 42px; }
        #tileGrid.compact .ring .track,
        #tileGrid.compact .ring .prog { stroke-width: 5; }
        #tileGrid.compact .ring img,
        #tileGrid.compact .ring .avatar-fallback { width: 34px; height: 34px; top: 4px; left: 4px; font-size: 11px; }
        #tileGrid.compact .ring .pct { font-size: 8.5px; padding: 1px 4px; bottom: -4px; right: -5px; }
        #tileGrid.compact .who h3 { font-size: 0.8125rem; }
        #tileGrid.compact .who .role { font-size: 0.6875rem; }
        #tileGrid.compact .who .dept { display: none; }
        #tileGrid.compact .skills,
        #tileGrid.compact .projects { display: none; }
        #tileGrid.compact .tile-foot { margin-top: 0.625rem; padding-top: 0.5rem; }

        /* List Row Mode */
        #tileGrid.list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        #tileGrid.list .tile {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.55rem 1rem;
            border-radius: 0.625rem;
        }
        #tileGrid.list .tile:hover { transform: translateX(2px); }
        #tileGrid.list .status-badge {
            position: static;
            order: 1;
            flex: 0 0 92px;
            justify-content: center;
        }
        #tileGrid.list .tile-head {
            order: 2;
            flex: 1 1 220px;
            min-width: 0;
            gap: 0.625rem;
            padding-right: 0;
        }
        #tileGrid.list .ring { width: 36px; height: 36px; }
        #tileGrid.list .ring svg { width: 36px; height: 36px; }
        #tileGrid.list .ring .track,
        #tileGrid.list .ring .prog { stroke-width: 5; }
        #tileGrid.list .ring img,
        #tileGrid.list .ring .avatar-fallback { width: 28px; height: 28px; top: 4px; left: 4px; font-size: 10px; }
        #tileGrid.list .ring .pct { font-size: 8px; padding: 0 4px; bottom: -4px; right: -5px; }
        #tileGrid.list .who h3 { font-size: 0.8125rem; }
        #tileGrid.list .who .role { font-size: 0.6875rem; }
        #tileGrid.list .who .dept { margin-top: 2px; font-size: 9px; padding: 1px 6px; }

        #tileGrid.list .skills {
            order: 3;
            flex: 1 1 210px;
            min-width: 0;
            margin-top: 0;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 0.375rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #tileGrid.list .skills::-webkit-scrollbar { display: none; }
        #tileGrid.list .skill-row {
            flex-shrink: 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9999px;
            padding: 2px 8px;
            gap: 4px;
        }
        #tileGrid.list .skill-name { width: auto; max-width: 82px; font-size: 10.5px; }
        #tileGrid.list .skill-bar { display: none; }
        #tileGrid.list .skill-pct { width: auto; font-size: 10px; }

        #tileGrid.list .projects {
            order: 4;
            flex: 1 1 190px;
            min-width: 0;
            margin-top: 0;
        }
        #tileGrid.list .projects-label { display: none; }
        #tileGrid.list .project-list {
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 0.375rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        #tileGrid.list .project-list::-webkit-scrollbar { display: none; }
        #tileGrid.list .project-chip {
            flex-shrink: 0;
            padding: 2px 8px;
            font-size: 10.5px;
            max-width: 165px;
        }
        #tileGrid.list .project-chip .proj-role { display: none; }
        #tileGrid.list .projects .none { font-size: 11px; white-space: nowrap; }

        #tileGrid.list .tile-foot {
            order: 5;
            margin-top: 0;
            padding-top: 0;
            border-top: none;
            flex: 0 0 auto;
            gap: 1.25rem;
        }

        @media (max-width: 960px) {
            #tileGrid.list .tile { flex-wrap: wrap; row-gap: 0.5rem; }
            #tileGrid.list .skills,
            #tileGrid.list .projects,
            #tileGrid.list .tile-foot { flex-basis: 100%; order: 10; }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
    <!-- Top Navigation Include -->
    <div th:replace="~{includes/header :: header}"></div>

    <!-- Page Header Bar -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-500 to-indigo-600 flex items-center justify-center text-white disp font-bold text-sm shadow-xs shrink-0">

                    </svg>

                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>

                <button type="button" onclick="getEmployeeData()" title="Sync now"

                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>

            </div>
        </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-4 sm:px-8 py-5 space-y-4">
        <!-- KPI & Department Chart Strip -->
        <section id="analytics" class="grid grid-cols-2 lg:grid-cols-12 gap-3.5"></section>

        <!-- Search, Filters & View Controls Bar -->
        <section class="bg-white border border-slate-200 rounded-xl p-3 shadow-2xs space-y-2.5">
            <div class="flex flex-col lg:flex-row lg:items-center gap-2.5">
                <!-- Search Input -->
                <div class="relative flex-1 min-w-[240px]">
                    <svg class="w-4 h-4 text-slate-400 pointer-events-none absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input id="searchInput" type="text"
                        placeholder="Search by employee name, designation, skill, or project..."
                        class="w-full pl-9 pr-8 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-teal-600 focus:ring-2 focus:ring-teal-600/15 transition">
                    <button id="searchClear" type="button" aria-label="Clear search"
                        class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-slate-200/80 text-slate-500 hover:bg-rose-100 hover:text-rose-600 items-center justify-center text-xs transition cursor-pointer">
                        &times;
                    </button>
                </div>

                <!-- Right Controls: Status Pills + Sort + View Toggle -->
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Status Filter Chips -->
                    <div id="statusFilters" class="flex items-center gap-1.5 flex-wrap"></div>

                    <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>

                    <!-- Sort Select -->
                    <div class="relative">
                        <select id="sortSelect"
                            class="appearance-none bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-700 text-xs font-medium rounded-lg pl-2.5 pr-7 py-1.5 focus:outline-none focus:border-teal-600 focus:bg-white transition cursor-pointer">
                            <option value="name">Sort: Name (A&ndash;Z)</option>
                            <option value="proficiency">Sort: Proficiency (High&ndash;Low)</option>
                            <option value="utilization">Sort: Utilization (High&ndash;Low)</option>
                        </select>
                        <svg class="w-3.5 h-3.5 text-slate-400 pointer-events-none absolute right-2 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>

                    <!-- View Mode Switcher -->
                    <div id="viewToggle" class="inline-flex items-center gap-0.5 bg-slate-100 border border-slate-200/80 rounded-lg p-0.5">
                        <button type="button" data-view="comfortable" title="Comfortable grid" aria-label="Comfortable grid"
                            class="p-1.5 rounded-md text-slate-500 hover:text-slate-900 transition cursor-pointer">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                                <rect x="14" y="14" width="7" height="7" rx="1.5" />
                            </svg>
                        </button>
                        <button type="button" data-view="compact" title="Compact cards" aria-label="Compact cards"
                            class="p-1.5 rounded-md text-slate-500 hover:text-slate-900 transition cursor-pointer">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="4.5" height="4.5" rx="1" />
                                <rect x="9.75" y="3" width="4.5" height="4.5" rx="1" />
                                <rect x="16.5" y="3" width="4.5" height="4.5" rx="1" />
                                <rect x="3" y="9.75" width="4.5" height="4.5" rx="1" />
                                <rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1" />
                                <rect x="16.5" y="9.75" width="4.5" height="4.5" rx="1" />
                                <rect x="3" y="16.5" width="4.5" height="4.5" rx="1" />
                                <rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1" />
                                <rect x="16.5" y="16.5" width="4.5" height="4.5" rx="1" />
                            </svg>
                        </button>
                        <button type="button" data-view="list" title="Compact list rows" aria-label="Compact list rows"
                            class="p-1.5 rounded-md text-slate-500 hover:text-slate-900 transition cursor-pointer">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="6" x2="21" y2="6" />
                                <line x1="3" y1="12" x2="21" y2="12" />
                                <line x1="3" y1="18" x2="21" y2="18" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Department Filter Bar -->
            <div class="pt-2 border-t border-slate-100 flex items-center gap-2 overflow-x-auto">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 shrink-0">Dept:</span>
                <div id="deptFilters" class="flex items-center gap-1.5 flex-wrap"></div>
            </div>
        </section>

        <!-- Employee Resource Grid -->
        <section id="tileGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5 pb-12"></section>
    </main>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/messenger :: chat-widget}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        /* -------------------- STATE -------------------- */
        let employees = [];
        let depts = ["All"];
        let activeDept = "All";
        const STATUSES = ["All", "Available", "Allocated", "On Leave"];
        let activeStatus = "All";
        let sortMode = "name";
        let searchTerm = "";
        let deptChart = null;

        let hasLoadedOnce = false;
        let analyticsBuilt = false;
        let lastDeptsKey = "";
        let toastVisible = false;
        let isPollingPaused = false;
        let pollTimer = null;

        let viewMode = (['comfortable', 'compact', 'list'].includes(localStorage.getItem('benchView')))
            ? localStorage.getItem('benchView')
            : 'comfortable';

        /* -------------------- FALLBACK MOCK DATA -------------------- */
        const MOCK_EMPLOYEES = [
            { EID: 1, firstName: "Ananya", lastName: "Rao", designation: "Senior Frontend Engineer", departmentShortName: "ENG", status: "Available", image: "https://i.pravatar.cc/150?img=47", util: 62, location: "Bengaluru", skills: [{ skill: "React", scale: 92 }, { skill: "TypeScript", scale: 85 }, { skill: "CSS", scale: 78 }], projects: [{ projectName: "Nimbus Redesign", role: "Lead FE", status: "Active" }] },
            { EID: 2, firstName: "Rohan", lastName: "Mehta", designation: "Backend Engineer", departmentShortName: "ENG", status: "Allocated", image: "https://i.pravatar.cc/150?img=12", util: 95, location: "Pune", skills: [{ skill: "Node.js", scale: 88 }, { skill: "PostgreSQL", scale: 80 }, { skill: "Docker", scale: 70 }], projects: [{ projectName: "Payments API v2", role: "Backend", status: "Active" }, { projectName: "Internal Tooling", role: "Support", status: "Active" }] },
            { EID: 3, firstName: "Priya", lastName: "Nair", designation: "UX Designer", departmentShortName: "DES", status: "Available", image: "https://i.pravatar.cc/150?img=32", util: 40, location: "Chennai", skills: [{ skill: "Figma", scale: 95 }, { skill: "Research", scale: 82 }, { skill: "Prototyping", scale: 88 }], projects: [] },
            { EID: 4, firstName: "Karthik", lastName: "Iyer", designation: "DevOps Engineer", departmentShortName: "ENG", status: "Allocated", image: "https://i.pravatar.cc/150?img=15", util: 88, location: "Hyderabad", skills: [{ skill: "Kubernetes", scale: 90 }, { skill: "AWS", scale: 84 }, { skill: "Terraform", scale: 75 }], projects: [{ projectName: "Cluster Migration", role: "DevOps Lead", status: "In Progress" }] },
            { EID: 5, firstName: "Sneha", lastName: "Kulkarni", designation: "Data Scientist", departmentShortName: "DATA", status: "Available", image: "https://i.pravatar.cc/150?img=44", util: 55, location: "Pune", skills: [{ skill: "Python", scale: 91 }, { skill: "ML/AI", scale: 86 }, { skill: "SQL", scale: 79 }], projects: [{ projectName: "Churn Prediction Model", role: "Contributor", status: "Active" }] },
            { EID: 6, firstName: "Vikram", lastName: "Singh", designation: "QA Automation Lead", departmentShortName: "QA", status: "On Leave", image: "https://i.pravatar.cc/150?img=53", util: 0, location: "Delhi NCR", skills: [{ skill: "Selenium", scale: 89 }, { skill: "Cypress", scale: 81 }, { skill: "CI/CD", scale: 72 }], projects: [{ projectName: "Regression Suite Overhaul", role: "Lead", status: "Completed" }] }
        ];

        /* -------------------- HELPERS -------------------- */
        function avgSkill(e) {
            if (!e.skills || !e.skills.length) return 0;
            return Math.round(e.skills.reduce((a, s) => a + Number(s.scale || 0), 0) / e.skills.length);
        }

        function colorForPct(p) {
            return p >= 85 ? '#0ea894' : p >= 70 ? '#d97706' : '#e11d48';
        }

        function statusMeta(s) {
            if (s === "Available") {
                return {
                    badge: "bg-teal-50 text-teal-700 border-teal-200/80",
                    dot: "bg-teal-500 animate-pulse"
                };
            }
            if (s === "On Leave") {
                return {
                    badge: "bg-rose-50 text-rose-700 border-rose-200/80",
                    dot: "bg-rose-500"
                };
            }
            return {
                badge: "bg-amber-50 text-amber-700 border-amber-200/80",
                dot: "bg-amber-500"
            };
        }

        function statusLabel(s) { return s || "Allocated"; }
        function fullName(e) { return [e.firstName, e.lastName].filter(Boolean).join(" "); }
        function initialsOf(e) {
            return [e.firstName?.[0], e.lastName?.[0]].filter(Boolean).join("").toUpperCase() || "?";
        }
        function resolveImageSrc(img) {
            if (!img) return "";
            if (img.startsWith("http://") || img.startsWith("https://") || img.startsWith("/") || img.startsWith("../")) {
                return img;
            }
            return "../" + img;
        }
        function utilOf(e) { return (e.util ?? e.utilization ?? Math.max(20, avgSkill(e) - 15)); }
        function locOf(e) { return e.location || e.loc || "Unassigned"; }
        function keyOf(e) { return String(e.EID ?? e.id ?? (fullName(e) + '|' + (e.designation || ''))); }
        function projectsOf(e) { return e.projects || e.projectList || []; }
        function projectNameOf(p) { return p.projectName || p.name || p.title || ""; }
        function projectRoleOf(p) { return p.role || p.allocation || ""; }
        function isActiveProject(p) {
            if (p.status === undefined || p.status === null || p.status === "") return true;
            const st = String(p.status).toLowerCase();
            return st.includes("active") || st.includes("progress");
        }
        function activeProjects(e) { return projectsOf(e).filter(isActiveProject); }
        function debounce(fn, wait) {
            let t;
            return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); };
        }

        function setLive(state, text) {
            const pill = document.getElementById('liveIndicator');
            const dot = document.getElementById('liveDot');
            const label = document.getElementById('liveText');
            if (!pill || !dot || !label) return;

            label.textContent = text;
            if (state === 'error') {
                pill.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs mono font-medium bg-rose-50 border border-rose-200 text-rose-700';
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
            } else if (state === 'paused') {
                pill.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs mono font-medium bg-amber-50 border border-amber-200 text-amber-700';
                dot.className = 'w-2 h-2 rounded-full bg-amber-500';
            } else {
                pill.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs mono font-medium bg-slate-50 border border-slate-200 text-slate-600';
                dot.className = 'w-2 h-2 rounded-full bg-teal-500 animate-pulse';
            }
        }

        function animateCount(el, target, suffix = "") {
            const current = parseInt(el.textContent, 10);
            const start = Number.isFinite(current) ? current : 0;
            if (start === target) { el.textContent = target + suffix; return; }
            const duration = 650;
            const startTime = performance.now();
            function step(now) {
                const p = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(start + (target - start) * eased) + suffix;
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        /* -------------------- DATA FETCH -------------------- */
        function getEmployeeData() {
            if (!hasLoadedOnce) {
                renderSkeleton();
            }
            $.ajax({
                url: '/admin/resourceData',
                type: 'GET',
                dataType: 'json',
                success: function (response) {
                    employees = response || [];
                    depts = ["All", ...new Set(employees.map(e => e.departmentShortName).filter(Boolean))];
                    hasLoadedOnce = true;
                    if (!isPollingPaused) setLive('live', 'Live · 5s sync');
                    renderAnalytics();
                    renderFilters();
                    renderStatusFilters();
                    renderTiles();
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching employee data:', error);
                    setLive('error', 'Offline · demo data');
                    if (!hasLoadedOnce) showToast('Could not reach /admin/resourceData. Showing demo data instead.');
                    employees = MOCK_EMPLOYEES;
                    depts = ["All", ...new Set(employees.map(e => e.departmentShortName).filter(Boolean))];
                    hasLoadedOnce = true;
                    renderAnalytics();
                    renderFilters();
                    renderStatusFilters();
                    renderTiles();
                }
            });
        }

        function showToast(msg) {
            if (toastVisible) return;
            toastVisible = true;
            const t = document.createElement('div');
            t.className = 'fixed bottom-5 right-5 z-50 bg-white border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-xs font-medium shadow-lg flex items-center gap-2.5 max-w-xs transition-opacity duration-300';
            t.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span><span>${msg}</span>`;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                setTimeout(() => { t.remove(); toastVisible = false; }, 300);
            }, 4200);
        }

        /* -------------------- SKELETON STATE -------------------- */
        function renderSkeleton() {

        /* -------------------- TILE BUILD / UPDATE -------------------- */
        function buildSkillRowHTML(s) {
            return `
                <div class="skill-row flex items-center gap-2" data-skill="${s.skill}">
                    <div class="skill-name text-[11.5px] font-medium text-slate-600 w-24 shrink-0 truncate" title="${s.skill}">${s.skill}</div>
                    <div class="skill-bar flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="skill-fill h-full rounded-full" data-target="${s.scale}" style="background:${colorForPct(s.scale)};"></div>
                    </div>
                    <div class="skill-pct mono text-[11px] font-medium text-slate-500 w-8 text-right shrink-0">${s.scale}%</div>
                </div>`;
        }

        function buildProjectChipHTML(p) {
            const name = projectNameOf(p) || "Untitled project";
            const role = projectRoleOf(p);
            return `
                <div class="project-chip flex items-center gap-1.5 bg-slate-50 border border-slate-200/80 rounded-lg px-2.5 py-1 text-[11.5px]" data-project="${name}">
                    <span class="w-1.5 h-1.5 rounded-full bg-teal-500 shrink-0"></span>
                    <span class="proj-name flex-1 font-medium text-slate-800 truncate" title="${name}">${name}</span>
                    ${role ? `<span class="proj-role text-[10.5px] text-slate-400 shrink-0">${role}</span>` : ""}
                </div>`;
        }

        function buildProjectsSectionHTML(e) {
            const active = activeProjects(e);
            if (!active.length) {
                return `
                    <span class="projects-label block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Active Projects</span>
                    <div class="none text-[11.5px] text-slate-400 italic bg-slate-50/70 border border-dashed border-slate-200 rounded-lg px-2.5 py-1.5">
                        Available on bench &mdash; no active project
                    </div>`;
            }
            return `
                <span class="projects-label block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Active Projects (${active.length})</span>
                <div class="project-list flex flex-col gap-1.5">${active.map(buildProjectChipHTML).join("")}</div>`;
        }

        function buildTileElement(e, i) {
            const avg = avgSkill(e);
            const circumference = 2 * Math.PI * 26;
            const ringColor = colorForPct(avg);
            const sm = statusMeta(e.status);
            const skillsHtml = (e.skills || []).map(buildSkillRowHTML).join("");
            const imgSrc = resolveImageSrc(e.image);

            const wrap = document.createElement('div');
            wrap.innerHTML = `
                <article class="tile tile-enter group relative bg-white border border-slate-200 rounded-xl p-4 shadow-2xs hover:border-slate-300 hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col justify-between"
                    data-key="${keyOf(e)}" style="animation-delay:${Math.min(i * 35, 350)}ms">

                    <!-- Status Badge -->
                    <span class="status-badge absolute top-3.5 right-3.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10.5px] font-semibold border ${sm.badge}">
                        <span class="w-1.5 h-1.5 rounded-full ${sm.dot}"></span>
                        <span class="status-label">${statusLabel(e.status)}</span>
                    </span>

                    <div>
                        <!-- Header: Ring Avatar + Name/Designation -->
                        <div class="tile-head flex items-center gap-3 pr-20">
                            <div class="ring relative w-[60px] h-[60px] shrink-0">
                                <svg width="60" height="60" viewBox="0 0 60 60">
                                    <circle class="track" cx="30" cy="30" r="26"></circle>
                                    <circle class="prog" cx="30" cy="30" r="26" stroke="${ringColor}"
                                        stroke-dasharray="0 ${circumference}" data-target="${(avg / 100) * circumference}" data-circ="${circumference}"></circle>
                                </svg>
                                <img src="${imgSrc}" alt="${fullName(e)}" loading="lazy"
                                    onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');"
                                    class="absolute top-[5px] left-[5px] w-[50px] h-[50px] rounded-full object-cover border-2 border-white shadow-2xs">
                                <div class="avatar-fallback hidden absolute top-[5px] left-[5px] w-[50px] h-[50px] rounded-full bg-indigo-50 text-indigo-700 font-bold text-xs flex items-center justify-center border-2 border-white">
                                    ${initialsOf(e)}
                                </div>
                                <span class="pct absolute -bottom-1 -right-1 bg-white border border-slate-200 rounded-full mono text-[9.5px] font-bold px-1.5 py-0.2 text-slate-800 shadow-2xs">
                                    ${avg}%
                                </span>
                            </div>

                            <div class="who min-w-0">
                                <h3 class="disp text-sm font-bold text-slate-900 truncate" title="${fullName(e)}">${fullName(e)}</h3>
                                <div class="role text-xs text-slate-500 truncate mt-0.5" title="${e.designation || ''}">${e.designation || ""}</div>
                                <span class="dept inline-block mt-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-100 border border-slate-200/80 rounded-md px-1.5 py-0.5">
                                    ${e.departmentShortName || "&mdash;"}
                                </span>
                            </div>
                        </div>

                        <!-- Skill Bars -->
                        <div class="skills mt-3.5 flex flex-col gap-2">${skillsHtml}</div>

                        <!-- Active Projects -->
                        <div class="projects mt-3.5">${buildProjectsSectionHTML(e)}</div>
                    </div>

                    <!-- Footer: Utilization & Location -->
                    <div class="tile-foot mt-3.5 pt-2.5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
                        <div class="util flex items-center gap-1">
                            <span>Utilization</span>
                            <b class="mono font-bold text-slate-800">${utilOf(e)}%</b>
                        </div>
                        <div class="loc flex items-center gap-1 truncate max-w-[130px]" title="${locOf(e)}">
                            <svg class="w-3 h-3 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span class="loc-text truncate">${locOf(e)}</span>
                        </div>
                    </div>
                </article>`;

            const tile = wrap.firstElementChild;

            requestAnimationFrame(() => {
                tile.querySelectorAll('.skill-fill').forEach(el => { el.style.width = el.dataset.target + '%'; });
                const prog = tile.querySelector('.prog');
                prog.setAttribute('stroke-dasharray', `${prog.dataset.target} ${prog.dataset.circ}`);
            });
            tile.addEventListener('animationend', () => tile.classList.remove('tile-enter'), { once: true });

            const projectsContainer = tile.querySelector('.projects');
            const initialActive = activeProjects(e);
            projectsContainer.dataset.projKey = initialActive.map(p => projectNameOf(p) + '|' + projectRoleOf(p)).join(',');

            return tile;
        }

        function updateTileElement(tile, e) {
            const avg = avgSkill(e);
            const circumference = 2 * Math.PI * 26;
            const sm = statusMeta(e.status);

            // Status badge
            const badge = tile.querySelector('.status-badge');
            badge.className = `status-badge absolute top-3.5 right-3.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10.5px] font-semibold border ${sm.badge}`;
            badge.querySelector('span:first-child').className = `w-1.5 h-1.5 rounded-full ${sm.dot}`;
            badge.querySelector('.status-label').textContent = statusLabel(e.status);

            // Ring
            const prog = tile.querySelector('.prog');
            const newDash = (avg / 100) * circumference;
            prog.setAttribute('stroke', colorForPct(avg));
            prog.setAttribute('stroke-dasharray', `${newDash} ${circumference}`);
            prog.dataset.target = newDash;
            tile.querySelector('.ring .pct').textContent = avg + '%';

            const img = tile.querySelector('.ring img');
            const resolvedSrc = resolveImageSrc(e.image);
            if (img.getAttribute('src') !== resolvedSrc) {
                img.classList.remove('hidden');
                img.nextElementSibling.classList.add('hidden');
                img.setAttribute('src', resolvedSrc);
            }

            // Who
            tile.querySelector('.who h3').textContent = fullName(e);
            tile.querySelector('.who .role').textContent = e.designation || "";
            tile.querySelector('.who .dept').textContent = e.departmentShortName || "—";

            // Skills
            const skillsContainer = tile.querySelector('.skills');
            const incomingSkills = e.skills || [];
            const incomingNames = new Set(incomingSkills.map(s => s.skill));

            incomingSkills.forEach(s => {
                const row = skillsContainer.querySelector(`.skill-row[data-skill="${CSS.escape(s.skill)}"]`);
                if (row) {
                    const fill = row.querySelector('.skill-fill');
                    fill.style.width = s.scale + '%';
                    fill.style.background = colorForPct(s.scale);
                    fill.dataset.target = s.scale;
                    row.querySelector('.skill-pct').textContent = s.scale + '%';
                } else {
                    skillsContainer.insertAdjacentHTML('beforeend', buildSkillRowHTML(s));
                    const newRow = skillsContainer.querySelector(`.skill-row[data-skill="${CSS.escape(s.skill)}"]`);
                    const fill = newRow.querySelector('.skill-fill');
                    requestAnimationFrame(() => { fill.style.width = fill.dataset.target + '%'; });
                }
            });
            skillsContainer.querySelectorAll('.skill-row').forEach(row => {
                if (!incomingNames.has(row.dataset.skill)) row.remove();
            });

            // Projects
            const projectsContainer = tile.querySelector('.projects');
            const incomingActive = activeProjects(e);
            const incomingProjKey = incomingActive.map(p => projectNameOf(p) + '|' + projectRoleOf(p)).join(',');
            if (projectsContainer.dataset.projKey !== incomingProjKey) {
                projectsContainer.innerHTML = buildProjectsSectionHTML(e);
                projectsContainer.dataset.projKey = incomingProjKey;
            }

            // Footer
            tile.querySelector('.util b').textContent = utilOf(e) + '%';
            tile.querySelector('.loc-text').textContent = locOf(e);
        }

        /* -------------------- RENDER TILES (Keyed Diff) -------------------- */
        function renderTiles() {
            const grid = document.getElementById('tileGrid');
            grid.querySelectorAll('.tile.skeleton').forEach(n => n.remove());

            let list = employees.filter(e => {
                const matchesDept = activeDept === "All" || e.departmentShortName === activeDept;
                const matchesStatus = activeStatus === "All" || statusLabel(e.status) === activeStatus;
                const projNames = projectsOf(e).map(projectNameOf).join(" ");
                const hay = (fullName(e) + " " + (e.designation || "") + " " + (e.skills || []).map(s => s.skill).join(" ") + " " + projNames).toLowerCase();
                return matchesDept && matchesStatus && hay.includes(searchTerm.toLowerCase());
            });

            if (sortMode === "name") list.sort((a, b) => fullName(a).localeCompare(fullName(b)));
            if (sortMode === "proficiency") list.sort((a, b) => avgSkill(b) - avgSkill(a));
            if (sortMode === "utilization") list.sort((a, b) => utilOf(b) - utilOf(a));

            const countBadge = document.getElementById('visibleCountBadge');
            if (countBadge) countBadge.textContent = `${list.length} / ${employees.length}`;

            const emptyEl = grid.querySelector('.empty');

            if (list.length === 0) {
                grid.querySelectorAll('.tile[data-key]').forEach(n => n.remove());
                if (!emptyEl) {
                    grid.innerHTML = `
                        <div class="empty col-span-full bg-white border border-dashed border-slate-200 rounded-xl py-12 px-4 text-center">
                            <p class="text-sm font-semibold text-slate-700">No matching resources found</p>
                            <p class="text-xs text-slate-400 mt-1">Adjust your search keywords, department, or status filters.</p>
                        </div>`;
                }
                return;
            }
            if (emptyEl) emptyEl.remove();

            const existing = new Map();
            const currentOrder = [];
            grid.querySelectorAll('.tile[data-key]').forEach(t => {
                existing.set(t.dataset.key, t);
                currentOrder.push(t.dataset.key);
            });

            const desiredOrder = list.map(keyOf);
            const orderChanged =
                currentOrder.length !== desiredOrder.length ||
                currentOrder.some((k, i) => k !== desiredOrder[i]);

            const seen = new Set();
            list.forEach((e, i) => {
                const key = keyOf(e);
                seen.add(key);
                let tile = existing.get(key);
                if (tile) {
                    updateTileElement(tile, e);
                    if (orderChanged) grid.appendChild(tile);
                } else {
                    tile = buildTileElement(e, i);
                    grid.appendChild(tile);
                }
            });

            existing.forEach((tile, key) => {
                if (!seen.has(key)) tile.remove();
            });
        }

        /* -------------------- FILTER CHIPS -------------------- */
        function renderFilters() {
            const key = depts.join('|');
            const wrap = document.getElementById('deptFilters');

            if (key === lastDeptsKey) {
                wrap.querySelectorAll('.chip-btn').forEach(btn => {
                    const isActive = btn.dataset.dept === activeDept;
                    btn.className = isActive
                        ? 'chip-btn px-2.5 py-1 rounded-full text-xs font-semibold bg-teal-600 text-white shadow-2xs transition cursor-pointer'
                        : 'chip-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200/70 hover:text-slate-900 transition cursor-pointer';
                });
                return;
            }
            lastDeptsKey = key;

            wrap.innerHTML = depts.map(d => {
                const isActive = d === activeDept;
                const cls = isActive
                    ? 'chip-btn px-2.5 py-1 rounded-full text-xs font-semibold bg-teal-600 text-white shadow-2xs transition cursor-pointer'
                    : 'chip-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200/70 hover:text-slate-900 transition cursor-pointer';
                return `<button type="button" class="${cls}" data-dept="${d}">${d}</button>`;
            }).join("");

            wrap.querySelectorAll('.chip-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.dept === activeDept) return;
                    activeDept = btn.dataset.dept;
                    renderFilters();
                    renderTiles();
                });
            });
        }

        function renderStatusFilters() {
            const wrap = document.getElementById('statusFilters');
            const dotColors = {
                "Available": "bg-teal-500",
                "Allocated": "bg-amber-500",
                "On Leave": "bg-rose-500"
            };

            const syncButtons = () => {
                wrap.querySelectorAll('.chip-btn').forEach(b => {
                    const isActive = b.dataset.status === activeStatus;
                    b.className = isActive
                        ? 'chip-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white shadow-2xs transition cursor-pointer'
                        : 'chip-btn inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition cursor-pointer';
                });
            };

            if (!wrap.dataset.built) {
                wrap.innerHTML = STATUSES.map(s => `
                    <button type="button" class="chip-btn" data-status="${s}">
                        ${s !== "All" ? `<span class="w-1.5 h-1.5 rounded-full ${dotColors[s]}"></span>` : ''}
                        <span>${s}</span>
                    </button>`).join("");
                wrap.dataset.built = "1";
                syncButtons();

                wrap.querySelectorAll('.chip-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.dataset.status === activeStatus) return;
                        activeStatus = btn.dataset.status;
                        syncButtons();
                        renderTiles();
                    });
                });
            }
        }

        /* -------------------- VIEW TOGGLE -------------------- */
        function applyViewMode() {
            const grid = document.getElementById('tileGrid');
            grid.classList.toggle('compact', viewMode === 'compact');
            grid.classList.toggle('list', viewMode === 'list');
            document.querySelectorAll('#viewToggle button').forEach(b => {
                const active = b.dataset.view === viewMode;
                b.className = active
                    ? 'p-1.5 rounded-md bg-white text-teal-600 shadow-2xs transition cursor-pointer'
                    : 'p-1.5 rounded-md text-slate-500 hover:text-slate-900 transition cursor-pointer';
            });
        }

        document.getElementById('viewToggle').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-view]');
            if (!btn) return;
            const wanted = btn.dataset.view;
            if (wanted === viewMode) return;
            viewMode = wanted;
            localStorage.setItem('benchView', viewMode);
            applyViewMode();
        });
        applyViewMode();

        /* -------------------- SEARCH & SORT -------------------- */
        const onSearch = debounce((val) => {
            searchTerm = val;
            renderTiles();
        }, 160);

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const clearBtn = document.getElementById('searchClear');
            if (e.target.value.length > 0) {
                clearBtn.classList.remove('hidden');
                clearBtn.classList.add('inline-flex');
            } else {
                clearBtn.classList.add('hidden');
                clearBtn.classList.remove('inline-flex');
            }
            onSearch(e.target.value);
        });

        document.getElementById('searchClear').addEventListener('click', () => {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('searchClear');
            input.value = "";
            input.focus();
            clearBtn.classList.add('hidden');
            clearBtn.classList.remove('inline-flex');
            searchTerm = "";
            renderTiles();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortMode = e.target.value;
            renderTiles();
        });

                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                    </div>

                <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-4 shadow-2xs hover:border-slate-300 transition flex flex-col justify-between">

                        </span>
                    </div>
                    <div class="disp text-2xl sm:text-3xl font-bold text-slate-900 mt-2 tabular-nums" id="kpiUtil">0%</div>
                    <div class="text-[11px] text-slate-400 mt-1" id="kpiUtilSub">healthy headroom</div>
                </div>

                <!-- KPI 4: Bench Availability -->
                <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-4 shadow-2xs hover:border-slate-300 transition flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">On Bench</span>
                        <span class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </span>
                    </div>
                    <div class="disp text-2xl sm:text-3xl font-bold text-teal-600 mt-2 tabular-nums" id="kpiAvail">0</div>
                    <div class="text-[11px] text-slate-400 mt-1" id="kpiAvailSub">0 on leave right now</div>
                </div>

                <!-- Chart Card -->
                <div class="col-span-2 lg:col-span-4 bg-white border border-slate-200 rounded-xl p-4 shadow-2xs">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Headcount by Department</span>
                        <span class="text-[10.5px] font-medium text-slate-400">Live split</span>
                    </div>
                    <div class="h-[92px] relative">
                        <canvas id="deptChart"></canvas>
                    </div>
                </div>
            `;

            const ctx = document.getElementById('deptChart');
            deptChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: '#0ea894',
                        hoverBackgroundColor: '#0d9488',
                        borderRadius: 5,
                        maxBarThickness: 22
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 450, easing: 'easeOutCubic' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleColor: '#f8fafc',
                            bodyColor: '#f8fafc',
                            padding: 8,
                            cornerRadius: 6
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#64748b', font: { size: 10, weight: '600' } },
                            grid: { display: false },
                            border: { display: false }
                        },
                        y: {
                            ticks: { color: '#94a3b8', font: { size: 10 }, stepSize: 1 },
                            grid: { color: '#f1f5f9' },
                            border: { display: false }
                        }
                    }
                }
            });

            analyticsBuilt = true;
        }

        function renderAnalytics() {
            if (!analyticsBuilt) buildAnalyticsShell();

            const total = employees.length;
            const avgProf = total ? Math.round(employees.reduce((a, e) => a + avgSkill(e), 0) / total) : 0;
            const avgUtil = total ? Math.round(employees.reduce((a, e) => a + utilOf(e), 0) / total) : 0;
            const available = employees.filter(e => e.status === "Available").length;
            const onLeave = employees.filter(e => e.status === "On Leave").length;

            animateCount(document.getElementById('kpiTotal'), total);
            animateCount(document.getElementById('kpiProf'), avgProf, '%');
            animateCount(document.getElementById('kpiUtil'), avgUtil, '%');
            animateCount(document.getElementById('kpiAvail'), available);

            document.getElementById('kpiTotalSub').textContent = `across ${Math.max(depts.length - 1, 0)} departments`;
            const utilSub = document.getElementById('kpiUtilSub');
            utilSub.textContent = avgUtil > 85 ? 'Nearing full capacity' : 'Healthy headroom';
            utilSub.className = 'text-[11px] mt-1 ' + (avgUtil > 85 ? 'font-semibold text-amber-600' : 'text-slate-400');
            document.getElementById('kpiAvailSub').textContent = `${onLeave} on leave right now`;

            const counts = {};
            employees.forEach(e => {
                const deptKey = e.departmentShortName || '—';
                counts[deptKey] = (counts[deptKey] || 0) + 1;
            });
            deptChart.data.labels = Object.keys(counts);
            deptChart.data.datasets[0].data = Object.values(counts);
            deptChart.update();
        }

        /* -------------------- POLLING & INIT -------------------- */
        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                if (!isPollingPaused) getEmployeeData();
            }, 5000);
        }

        document.getElementById('togglePollBtn').addEventListener('click', () => {
            isPollingPaused = !isPollingPaused;
            document.getElementById('pollIconPause').classList.toggle('hidden', isPollingPaused);
            document.getElementById('pollIconPlay').classList.toggle('hidden', !isPollingPaused);
            document.getElementById('pollBtnLabel').textContent = isPollingPaused ? 'Resume' : 'Pause';

            if (isPollingPaused) {
                setLive('paused', 'Paused');
            } else {
                setLive('live', 'Live · 5s sync');
                getEmployeeData();
            }
        });

        getEmployeeData();
        startPolling();
    </script>
</body>
</html>
