<script>
$(document).ready(function () {

  const projectId = "<?php echo htmlspecialchars($_GET['projectId']); ?>";

  $("#title").text(`${projectName}'s Allotments`);
  const dateToday = "<?php echo date('d-M-Y'); ?>";

  function toggleSaveButton(isLoading) {
      const btn = $("#saveAllotmentBtn");
      if (isLoading) {
          btn.attr("disabled", true).html('<span class="spinner-border spinner-border-sm me-2"></span>Saving...');
      } else {
          btn.attr("disabled", false).html('Create Allotment');
      }
  }

  function getStatusBadge(status) {
      let badgeClass = 'bg-secondary';
      let icon = 'fa-info-circle';
      if (status.includes('Completed')) { badgeClass = 'text-bg-success'; icon = 'fa-check'; }
      else if (status.includes('In Progress')) { badgeClass = 'text-bg-primary'; icon = 'fa-spinner fa-spin'; }
      else if (status.includes('Pending')) { badgeClass = 'text-bg-warning'; icon = 'fa-clock'; }
      else if (status.includes('Cancelled')) { badgeClass = 'text-bg-danger'; icon = 'fa-times'; }
      
      return `<span class="badge badge-compact ${badgeClass}"><i class="fas ${icon}"></i> ${status}</span>`;
  }

  /* Fetch Allotment Data */
  $.post("api/projDashboard.php", { action: "getAllotmentsByProject", projectId: projectId }, function (res) {
          let finalData = res.data ? res.data : res;
          if (!Array.isArray(finalData)) return;
          populateTable(finalData);
          $("#dataTableWrapper").show();
          $("#enhancedDataTable").DataTable({
              pageLength: 25,
              lengthMenu: [10, 25, 50, 100],
              ordering: true,
              autoWidth: false
          });
      }, "json"
  );
window.callReopen = function(pid) {
Swal.fire({
  title: "Are you sure?",
  text: `This Action Will Allotment To Active State!`,
  icon: "warning",
  showCancelButton: true,
  confirmButtonColor: "#3085d6",
  cancelButtonColor: "#d33",
  confirmButtonText: "Yes, Move!"
}).then((result) => {
  if (result.isConfirmed) {
    $.ajax({
      url:'api/projDashboard.php',
      type:'POST',
      data:{action:'reopenAllotment',pid:pid},
      dataType:'JSON',
      success:function(res){
        Swal.fire({
    title: "Moved!",
    text: "Allotment Moved To Active State.",
    icon: "success"
  }).then(()=>{
    location.reload();
  })
      },
      error:function(err){
      }
    })
  }
});
};
window.callFinish = function(pid) {
Swal.fire({
  title: "Are you sure?",
  text: `This Action Will Allotment To Finished State!`,
  icon: "warning",
  showCancelButton: true,
  confirmButtonColor: "#3085d6",
  cancelButtonColor: "#d33",
  confirmButtonText: "Yes, Move!"
}).then((result) => {
  if (result.isConfirmed) {
    $.ajax({
      url:'api/projectApi.php',
      type:'POST',
      data:{finishNoInvoice:pid},
      dataType:'JSON',
      success:function(res){
        Swal.fire({
    title: "Finished !",
    text: "Allotment Moved To Finish State.",
    icon: "success"
  }).then(()=>{
    location.reload();
  })
      },
      error:function(err){
      }
    })
  }
});
};
function populateTable(data) {
    let html = "";
    let counter = 1;

    data.forEach(p => {
        // Moved inside the loop to correctly read 'p.pid' for each row
        const actionBtn = p.Status=='Finished'?`
            <button class="flex items-center gap-2 px-3 py-1.5 bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg transition-colors text-sm font-medium" onclick="callReopen(${p.pid})">
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                Reopen
            </button>`:(p.Status=='Active'?`
            <button class="flex items-center gap-2 px-3 py-1.5 bg-green-50 text-green-600 hover:bg-green-100 rounded-lg transition-colors text-sm font-medium" onclick="callFinish(${p.pid})">
                <i data-lucide="check-circle-2" class="w-3 h-3"></i>
                Finish
            </button>`:'N/A');

        html += `
          <tr>
            <td class="text-center text-muted small">${counter++}</td>
            <td><a href="viewProject.php?id=${p.pid}" class="text-primary-color text-decoration-none">${p.allotment}</a></td>
            <td><span class="text-secondary">${p.projectLead || 'N/A'}</span></td>
            <td class="text-end text-muted">${p.startDate || 'N/A'}</td>
            <td class="text-end text-muted">${p.endDate || 'N/A'}</td>
               <td class="text-end text-muted">${p.finishedOn || 'N/A'}</td>
            <td class="text-end fw-bold text-dark">${p.totalHrs || '0.00'}</td>
            <td class="text-end text-success">${p.productionHrs || '0.00'}</td>
            <td class="text-end text-primary">${p.qaHrs || '0.00'}</td>
            <td class="text-center">${getStatusBadge(p.Status || 'Pending')}</td>
            <td class="text-right">${actionBtn}</td>
          </tr>`;
    });

    $("#root").html(html);
    
    // Initialize Lucide icons right after rendering the HTML
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }

    $("#header").html(`<i class="fas fa-layer-group me-2 text-primary"></i> ${projectName} <span class="text-muted fw-normal ms-2" style="font-size:0.85rem">| As of ${dateToday}</span>`);
}

  function fetchProjectLeads(selectElement = $("#projectLeadSelect")) {
      $.post("api/projDashboard.php", { action: "getProjectLeads" }, function (data) {
              const select = selectElement;
              select.empty().append(`<option value="">-- Select Lead --</option>`);
              if (Array.isArray(data)) { data.forEach(l => { select.append(`<option value="${l.eid}">${l.employeeName}</option>`); }); }
          }, "json"
      );
  }

  function calculateHours() {
      const totalHours = parseFloat($("#totalHoursInput").val()) || 0;
      const qcPercent = parseFloat($("#qcPercentageInput").val()) || 0;
      if (totalHours <= 0 || qcPercent < 0 || qcPercent > 100) {
          $("#qcHoursDisplay").val("0.00"); $("#productionHoursDisplay").val("0.00"); return;
      }
      const qcHours = (totalHours * (qcPercent / 100)).toFixed(2);
      const productionHours = (totalHours - parseFloat(qcHours)).toFixed(2);
      $("#qcHoursDisplay").val(qcHours);
      $("#productionHoursDisplay").val(productionHours);
  }

  $("#totalHoursInput, #qcPercentageInput").on("input", calculateHours);

  $("#openCreateAllotmentBtn").click(function () {
      fetchDepartments();
      $("#createAllotmentForm")[0].reset();
      $("#qcHoursDisplay, #productionHoursDisplay").val("0.00");
      fetchProjectLeads($("#allotmentLeadSelect"));
      toggleSaveButton(false);
      new bootstrap.Modal("#createAllotmentModal").show();
  });

  /* Submit listener replaces click listener */
  $("#createAllotmentForm").on("submit", function (e) {
      e.preventDefault();
      
      const fixedHoursValue = $("#fixedhours").is(":checked") ? 1 : 0;      
      toggleSaveButton(true);
       const csrfToken = document.getElementById("csrfToken").value;

      $.post("api/projDashboard.php", {
          action: "createAllotment",
          projectId: projectId,
          allotmentName: $("#allotmentNameInput").val().trim(),
          startDate: $("#startDateInput").val(),
          deadline: $("#deadlineInput").val(),
          totalHours: parseFloat($("#totalHoursInput").val())||0,
          qcPercentage: parseFloat($("#qcPercentageInput").val()),
          qcHours: $("#qcHoursDisplay").val()||0,
          productionHours: $("#productionHoursDisplay").val()||0,
          projectLeadId: $("#allotmentLeadSelect").val(),
          filePath: $("#filePathInput").val().trim(),
          department: $("#departmentSelect").val(),
          area: $("#area").val(),
          fixedHours: fixedHoursValue
      }, function(res){
          toggleSaveButton(false);
          if (res && res.status === "success") { 
              alert("Created Successfully!"); 
              location.reload(); 
          }
          else { 
              alert(`Error: ${res ? res.message : 'Unknown error'}`); 
          }
      }, "json").fail(function() { 
          toggleSaveButton(false); 
          alert("API call failed."); 
      });
  });

  function fetchDepartments() {
      $.post("api/projectApi.php", { getDepartments: "getDepartments" }, function (data) {
              const select = $("#departmentSelect");
              select.empty().append(`<option value="">-- Select Department --</option>`);
              if (data) { data.forEach(c => { select.append(`<option value="${c.id}">${c.DepartmentShortName}</option>`); }); }
          }, "json"
      );
  }
});
